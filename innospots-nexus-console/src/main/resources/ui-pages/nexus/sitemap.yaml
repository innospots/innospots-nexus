# Nexus 控制台 Sitemap（nexus 领域当前仅插件管理 entry）。
id: site
resourceType: sitemap
version: 1
dslVersion: "1.0"
app: { name: Innospots Nexus Console }
layout: admin
auth: { loginPath: /login }

pages:
  - { id: nexus-plugin-main, path: /page/nexus/plugin/nexus-plugin-main, title: 插件管理, version: 1, lazy: true }

menus:
  - { id: nexus-plugin-main, type: page, pageId: nexus-plugin-main, title: 插件管理, icon: appstore, layout: admin, order: 10 }

layouts:
  admin:
    dsl: "1.0"
    body:
      type: Layout
      props: { className: shell-root }
      children:
        - type: Sidebar
          props:
            className: shell-main
            brand: { title: Innospots Nexus, logo: /logo.svg }
            collapsible: true
            content:
              type: SitemapMenu
              props:
                items: ${data.session.menus}
                collapsible: true
                className: shell-menu
              events:
                onSelect:
                  - action: navigate
                    params: { to: "${event}" }
          children:
            - type: Header
              props:
                className: shell-header
                user:
                  name: ${data.session.user.name}
                  items:
                    - { label: 退出登录, value: logout, icon: log-out }
              events:
                onUserSelect:
                  - action: if
                    params:
                      condition: ${event == 'logout'}
                      then:
                        - action: request
                          params:
                            method: POST
                            url: /tenant/auth/logout
                        - action: app.reload
                          params: { to: /login }
              children:
                - type: ThemeSwitcher
            - type: Content
              props: { className: shell-content }
              children:
                - type: PageOutlet
  login:
    dsl: "1.0"
    body:
      type: Flex
      props:
        className: login-page
      children:
        - type: PageOutlet
  blank:
    dsl: "1.0"
    body:
      type: PageOutlet
