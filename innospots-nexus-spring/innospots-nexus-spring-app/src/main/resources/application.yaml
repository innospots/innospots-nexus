spring:
  application:
    name: nexus-app
  datasource:
    url: jdbc:h2:mem:nexus;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:nexus/schema/plugin-installation-h2.sql,classpath:nexus/schema/console-catalog-h2.sql

server:
  port: 8080

# ---------------------------------------------------------------------------
# Nexus 插件宿主策略（应用服务默认骨架，无控制台内置 required 列表）
#
# 绑定类: com.innospots.nexus.spring.plugin.config.PluginHostProperties
# 装配类:
#   - PluginHostConfiguration      → PluginRuntimeConfig（启停策略）
#   - NexusStartupConfiguration    → PluginInstallationConfig（安装策略）
# ---------------------------------------------------------------------------
nexus:
  plugin:
    # nexus.plugin.auto-install
    # 含义: classpath 首次发现插件时，是否自动写入 nx_plugin_installation 并期望启用。
    # 默认: true（PluginHostProperties / NexusPluginHostConfig）
    auto-install: true

  plugins:
    # nexus.plugins.required
    # 含义: 启动后必须 ACTIVE 的插件 ID；未满足则宿主启动失败。
    # required: []

    # nexus.plugins.disabled
    # 含义: 永不自动启动的插件 ID；与 required 不能重叠。
    # disabled: []

# plugins.<pluginId>.<key>
# 含义: 单个插件实例的运行参数，由 PluginHostConfigBinder 汇总进 hostConfig。
# 示例:
# plugins:
#   com.example.message-wecom:
#     corpId: ww-demo
