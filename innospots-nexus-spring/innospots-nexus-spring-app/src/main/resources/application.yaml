spring:
  application:
    name: nexus-app
  datasource:
    url: jdbc:h2:mem:nexus;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:nexus/schema/plugin-installation-h2.sql

server:
  port: 8080

# nexus.plugin.* / nexus.plugins.* 默认值见 PluginHostProperties；以下为独立服务运行示例，可按环境覆盖
# plugins.<pluginId>.<key> 为插件实例配置，示例：
# plugins:
#   com.example.message-wecom:
#     corpId: ww-demo
