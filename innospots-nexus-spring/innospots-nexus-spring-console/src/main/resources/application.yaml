spring:
  application:
    name: nexus-console
  datasource:
    url: jdbc:h2:mem:nexus-console;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:nexus/schema/plugin-installation-h2.sql,classpath:nexus/schema/console-catalog-h2.sql

server:
  port: 8081

nexus:
  workspace:
    default-id: default
  plugins:
    required:
      - com.innospots.nexus.console.menu
      - com.innospots.nexus.console.dictionary
      - com.innospots.nexus.console.logger
      - com.innospots.nexus.console.permission
      - com.innospots.nexus.console.role
      - com.innospots.nexus.console.plugin-management

# nexus.plugin.* / plugins.* 配置方式同 innospots-nexus-spring-app
