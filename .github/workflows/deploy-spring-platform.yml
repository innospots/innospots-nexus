name: Deploy Spring Platform Sample

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - innospots-nexus-sample/innospots-nexus-sample-spring-platform/**
      - innospots-nexus-sample/assets/**
      - deploy/innospots-nexus-sample-spring-platform/**
      - deploy/deploy.sh
      - deploy/apps.env
      - .github/workflows/deploy-spring-platform.yml

permissions:
  contents: read

concurrency:
  group: deploy-nexus-sample-spring-platform
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy spring-platform
    runs-on:
      - self-hosted
      - linux
      - production
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Ensure deploy directories
        run: |
          chmod +x deploy/innospots-nexus-sample-spring-platform/init-server.sh
          ./deploy/innospots-nexus-sample-spring-platform/init-server.sh

      - name: Build and deploy
        env:
          GITHUB_SHA: ${{ github.sha }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          chmod +x deploy/innospots-nexus-sample-spring-platform/*.sh
          chmod +x deploy/deploy.sh
          ./deploy/innospots-nexus-sample-spring-platform/deploy.sh --build
