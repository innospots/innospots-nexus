dsl: "1.0"
page:
  id: system-settings
  title: "$i18n{common.page.system-settings.title:系统设置}"
  name: system-settings
  domain: system
  module: settings
i18n: { namespaces: [common] }
dataSources:
  settings:
    type: http
    autoLoad: true
    request: { method: GET, url: /api/d/system-settings }
body:
  type: Page
  props: { className: system-settings-page }
  children:
    - type: Typography
      props: { variant: h3, className: system-page-title, text: "$i18n{common.page.system-settings.title:系统设置}" }
    - type: Typography
      props: { variant: muted, className: system-page-description, text: "$i18n{common.systemSettings.subtitle:管理系统的常用配置}" }
    - type: Alert
      props: { variant: info, message: "$i18n{common.systemSettings.note:示例设置仅保存在当前服务进程中。}", style: { marginTop: 20 } }
    - type: Card
      props: { title: "$i18n{common.systemSettings.group.navigation:界面与导航}", style: { marginTop: 20 } }
      children:
        - type: NavigationLayoutSettingPanel
    - type: Alert
      when: ${dataStatus.settings.error != null}
      props: { variant: error, message: "$i18n{common.systemSettings.loadError:无法加载系统设置，请刷新重试。}" }
    - type: Card
      props: { title: "$i18n{common.systemSettings.group.basic:基本信息}", style: { marginTop: 20 } }
      children:
        - type: Flex
          props: { className: system-setting, justify: space-between, align: center }
          children:
            - type: Flex
              props: { direction: vertical, gap: 4 }
              children:
                - type: Text
                  props: { strong: true, text: "$i18n{common.systemSettings.siteName.label:系统名称}" }
                - type: Typography
                  props: { variant: muted, text: "$i18n{common.systemSettings.siteName.description:设置系统对外显示的名称。}" }
            - type: Flex
              props: { className: system-setting-display, align: center }
              children:
                - type: Text
                  props: { text: "${data.settings.siteName}" }
                - type: Button
                  props: { text: "$i18n{common.settingsPage.edit:修改}", variant: link, disabled: "${dataStatus.settings.loading}" }
                  events:
                    onClick:
                      - action: overlay.open
                        params:
                          overlay:
                            type: modal
                            title: "$i18n{common.systemSettings.siteName.label:系统名称}"
                            width: 440
                            content:
                              type: Form
                              props: { layout: vertical, initialValues: { value: "${data.settings.siteName}" } }
                              events:
                                onSubmit:
                                  - id: saveResult
                                    action: request
                                    params: { method: PATCH, url: /api/d/system-settings, body: { key: siteName, value: "${event.value}" } }
                                  - action: if
                                    params:
                                      condition: ${actions.saveResult != null && actions.saveResult.ok != false}
                                      then:
                                        - action: overlay.close
                                        - action: reload
                                          params: { dataSource: settings }
                                      else:
                                        - action: message
                                          params: { messageType: error, text: "$i18n{common.systemSettings.saveError:保存失败，请重试。}" }
                              children:
                                - type: Field
                                  props: { label: "$i18n{common.systemSettings.siteName.label:系统名称}", required: true }
                                  children:
                                    - type: Input
                                      props: { name: value, maxLength: 80, rules: [{ required: true, message: "$i18n{common.settingsPage.required:请输入系统名称}" }] }
                                - type: Flex
                                  props: { justify: end, gap: small }
                                  children:
                                    - type: Button
                                      props: { text: "$i18n{common.settingsPage.cancel:取消}" }
                                      events:
                                        onClick:
                                          - action: overlay.close
                                    - type: Button
                                      props: { text: "$i18n{common.settingsPage.save:保存}", variant: primary, submit: true }
        - type: Flex
          props: { className: system-setting, justify: space-between, align: center }
          children:
            - type: Flex
              props: { direction: vertical, gap: 4 }
              children:
                - type: Text
                  props: { strong: true, text: "$i18n{common.systemSettings.systemDescription.label:系统简介}" }
                - type: Typography
                  props: { variant: muted, text: "$i18n{common.systemSettings.systemDescription.description:描述系统的用途。}" }
            - type: Flex
              props: { className: system-setting-display, align: center }
              children:
                - type: Text
                  props: { text: "${data.settings.description}" }
                - type: Button
                  props: { text: "$i18n{common.settingsPage.edit:修改}", variant: link, disabled: "${dataStatus.settings.loading}" }
                  events:
                    onClick:
                      - action: overlay.open
                        params:
                          overlay:
                            type: modal
                            title: "$i18n{common.systemSettings.systemDescription.label:系统简介}"
                            width: 440
                            content:
                              type: Form
                              props: { layout: vertical, initialValues: { value: "${data.settings.description}" } }
                              events:
                                onSubmit:
                                  - id: saveResult
                                    action: request
                                    params: { method: PATCH, url: /api/d/system-settings, body: { key: description, value: "${event.value}" } }
                                  - action: if
                                    params:
                                      condition: ${actions.saveResult != null && actions.saveResult.ok != false}
                                      then:
                                        - action: overlay.close
                                        - action: reload
                                          params: { dataSource: settings }
                                      else:
                                        - action: message
                                          params: { messageType: error, text: "$i18n{common.systemSettings.saveError:保存失败，请重试。}" }
                              children:
                                - type: Field
                                  props: { label: "$i18n{common.systemSettings.systemDescription.label:系统简介}" }
                                  children:
                                    - type: Input
                                      props: { name: value, maxLength: 200 }
                                - type: Flex
                                  props: { justify: end, gap: small }
                                  children:
                                    - type: Button
                                      props: { text: "$i18n{common.settingsPage.cancel:取消}" }
                                      events:
                                        onClick:
                                          - action: overlay.close
                                    - type: Button
                                      props: { text: "$i18n{common.settingsPage.save:保存}", variant: primary, submit: true }
    - type: Card
      props: { title: "$i18n{common.systemSettings.group.display:显示与区域}", style: { marginTop: 20 } }
      children:
        - type: Flex
          props: { className: system-setting, justify: space-between, align: center }
          children:
            - type: Flex
              props: { direction: vertical, gap: 4 }
              children:
                - type: Text
                  props: { strong: true, text: "$i18n{common.systemSettings.language.label:显示语言}" }
                - type: Typography
                  props: { variant: muted, text: "$i18n{common.systemSettings.language.description:设置系统默认显示语言。}" }
            - type: Flex
              props: { className: system-setting-display, align: center }
              children:
                - type: Text
                  props: { text: "${data.settings.language == 'zh-CN' ? t('common.systemSettings.language.zh') : data.settings.language == 'en-US' ? t('common.systemSettings.language.en') : data.settings.language}" }
                - type: Button
                  props: { text: "$i18n{common.settingsPage.edit:修改}", variant: link, disabled: "${dataStatus.settings.loading}" }
                  events:
                    onClick:
                      - action: overlay.open
                        params:
                          overlay:
                            type: modal
                            title: "$i18n{common.systemSettings.language.label:显示语言}"
                            width: 440
                            content:
                              type: Form
                              props: { layout: vertical, initialValues: { value: "${data.settings.language}" } }
                              events:
                                onSubmit:
                                  - id: saveResult
                                    action: request
                                    params: { method: PATCH, url: /api/d/system-settings, body: { key: language, value: "${event.value}" } }
                                  - action: if
                                    params:
                                      condition: ${actions.saveResult != null && actions.saveResult.ok != false}
                                      then:
                                        - action: overlay.close
                                        - action: reload
                                          params: { dataSource: settings }
                                      else:
                                        - action: message
                                          params: { messageType: error, text: "$i18n{common.systemSettings.saveError:保存失败，请重试。}" }
                              children:
                                - type: Field
                                  props: { label: "$i18n{common.systemSettings.language.label:显示语言}" }
                                  children:
                                    - type: Select
                                      props:
                                        name: value
                                        options:
                                          - { value: "zh-CN", label: "$i18n{common.systemSettings.language.zh:简体中文}" }
                                          - { value: "en-US", label: "$i18n{common.systemSettings.language.en:English}" }
                                - type: Flex
                                  props: { justify: end, gap: small }
                                  children:
                                    - type: Button
                                      props: { text: "$i18n{common.settingsPage.cancel:取消}" }
                                      events:
                                        onClick:
                                          - action: overlay.close
                                    - type: Button
                                      props: { text: "$i18n{common.settingsPage.save:保存}", variant: primary, submit: true }
        - type: Flex
          props: { className: system-setting, justify: space-between, align: center }
          children:
            - type: Flex
              props: { direction: vertical, gap: 4 }
              children:
                - type: Text
                  props: { strong: true, text: "$i18n{common.systemSettings.timezone.label:默认时区}" }
                - type: Typography
                  props: { variant: muted, text: "$i18n{common.systemSettings.timezone.description:设置系统默认使用的时区。}" }
            - type: Flex
              props: { className: system-setting-display, align: center }
              children:
                - type: Text
                  props: { text: "${data.settings.timezone == 'Asia/Shanghai' ? t('common.systemSettings.timezone.shanghai') : data.settings.timezone == 'UTC' ? t('common.systemSettings.timezone.utc') : data.settings.timezone == 'America/New_York' ? t('common.systemSettings.timezone.newYork') : data.settings.timezone}" }
                - type: Button
                  props: { text: "$i18n{common.settingsPage.edit:修改}", variant: link, disabled: "${dataStatus.settings.loading}" }
                  events:
                    onClick:
                      - action: overlay.open
                        params:
                          overlay:
                            type: modal
                            title: "$i18n{common.systemSettings.timezone.label:默认时区}"
                            width: 440
                            content:
                              type: Form
                              props: { layout: vertical, initialValues: { value: "${data.settings.timezone}" } }
                              events:
                                onSubmit:
                                  - id: saveResult
                                    action: request
                                    params: { method: PATCH, url: /api/d/system-settings, body: { key: timezone, value: "${event.value}" } }
                                  - action: if
                                    params:
                                      condition: ${actions.saveResult != null && actions.saveResult.ok != false}
                                      then:
                                        - action: overlay.close
                                        - action: reload
                                          params: { dataSource: settings }
                                      else:
                                        - action: message
                                          params: { messageType: error, text: "$i18n{common.systemSettings.saveError:保存失败，请重试。}" }
                              children:
                                - type: Field
                                  props: { label: "$i18n{common.systemSettings.timezone.label:默认时区}" }
                                  children:
                                    - type: Select
                                      props:
                                        name: value
                                        options:
                                          - { value: "Asia/Shanghai", label: "$i18n{common.systemSettings.timezone.shanghai:中国标准时间（UTC+8）}" }
                                          - { value: "UTC", label: "$i18n{common.systemSettings.timezone.utc:协调世界时（UTC）}" }
                                          - { value: "America/New_York", label: "$i18n{common.systemSettings.timezone.newYork:美国东部时间}" }
                                - type: Flex
                                  props: { justify: end, gap: small }
                                  children:
                                    - type: Button
                                      props: { text: "$i18n{common.settingsPage.cancel:取消}" }
                                      events:
                                        onClick:
                                          - action: overlay.close
                                    - type: Button
                                      props: { text: "$i18n{common.settingsPage.save:保存}", variant: primary, submit: true }
        - type: Flex
          props: { className: system-setting, justify: space-between, align: center }
          children:
            - type: Flex
              props: { direction: vertical, gap: 4 }
              children:
                - type: Text
                  props: { strong: true, text: "$i18n{common.systemSettings.pageSize.label:默认每页条数}" }
                - type: Typography
                  props: { variant: muted, text: "$i18n{common.systemSettings.pageSize.description:设置列表默认的分页大小。}" }
            - type: Flex
              props: { className: system-setting-display, align: center }
              children:
                - type: Text
                  props: { text: "${t('common.systemSettings.pageSize.option', { value: data.settings.pageSize })}" }
                - type: Button
                  props: { text: "$i18n{common.settingsPage.edit:修改}", variant: link, disabled: "${dataStatus.settings.loading}" }
                  events:
                    onClick:
                      - action: overlay.open
                        params:
                          overlay:
                            type: modal
                            title: "$i18n{common.systemSettings.pageSize.label:默认每页条数}"
                            width: 440
                            content:
                              type: Form
                              props: { layout: vertical, initialValues: { value: "${data.settings.pageSize}" } }
                              events:
                                onSubmit:
                                  - id: saveResult
                                    action: request
                                    params: { method: PATCH, url: /api/d/system-settings, body: { key: pageSize, value: "${event.value}" } }
                                  - action: if
                                    params:
                                      condition: ${actions.saveResult != null && actions.saveResult.ok != false}
                                      then:
                                        - action: overlay.close
                                        - action: reload
                                          params: { dataSource: settings }
                                      else:
                                        - action: message
                                          params: { messageType: error, text: "$i18n{common.systemSettings.saveError:保存失败，请重试。}" }
                              children:
                                - type: Field
                                  props: { label: "$i18n{common.systemSettings.pageSize.label:默认每页条数}" }
                                  children:
                                    - type: Select
                                      props:
                                        name: value
                                        options:
                                          - { value: "10", label: "10" }
                                          - { value: "20", label: "20" }
                                          - { value: "50", label: "50" }
                                - type: Flex
                                  props: { justify: end, gap: small }
                                  children:
                                    - type: Button
                                      props: { text: "$i18n{common.settingsPage.cancel:取消}" }
                                      events:
                                        onClick:
                                          - action: overlay.close
                                    - type: Button
                                      props: { text: "$i18n{common.settingsPage.save:保存}", variant: primary, submit: true }
    - type: Card
      props: { title: "$i18n{common.systemSettings.group.session:会话}", style: { marginTop: 20 } }
      children:
        - type: Flex
          props: { className: system-setting, justify: space-between, align: center }
          children:
            - type: Flex
              props: { direction: vertical, gap: 4 }
              children:
                - type: Text
                  props: { strong: true, text: "$i18n{common.systemSettings.sessionTimeout.label:会话超时时间}" }
                - type: Typography
                  props: { variant: muted, text: "$i18n{common.systemSettings.sessionTimeout.description:设置闲置会话的超时时间。}" }
            - type: Flex
              props: { className: system-setting-display, align: center }
              children:
                - type: Text
                  props: { text: "${t('common.systemSettings.sessionTimeout.option', { value: data.settings.sessionTimeout })}" }
                - type: Button
                  props: { text: "$i18n{common.settingsPage.edit:修改}", variant: link, disabled: "${dataStatus.settings.loading}" }
                  events:
                    onClick:
                      - action: overlay.open
                        params:
                          overlay:
                            type: modal
                            title: "$i18n{common.systemSettings.sessionTimeout.label:会话超时时间}"
                            width: 440
                            content:
                              type: Form
                              props: { layout: vertical, initialValues: { value: "${data.settings.sessionTimeout}" } }
                              events:
                                onSubmit:
                                  - id: saveResult
                                    action: request
                                    params: { method: PATCH, url: /api/d/system-settings, body: { key: sessionTimeout, value: "${event.value}" } }
                                  - action: if
                                    params:
                                      condition: ${actions.saveResult != null && actions.saveResult.ok != false}
                                      then:
                                        - action: overlay.close
                                        - action: reload
                                          params: { dataSource: settings }
                                      else:
                                        - action: message
                                          params: { messageType: error, text: "$i18n{common.systemSettings.saveError:保存失败，请重试。}" }
                              children:
                                - type: Field
                                  props: { label: "$i18n{common.systemSettings.sessionTimeout.label:会话超时时间}" }
                                  children:
                                    - type: Select
                                      props:
                                        name: value
                                        options:
                                          - { value: "15", label: "15" }
                                          - { value: "30", label: "30" }
                                          - { value: "60", label: "60" }
                                          - { value: "120", label: "120" }
                                - type: Flex
                                  props: { justify: end, gap: small }
                                  children:
                                    - type: Button
                                      props: { text: "$i18n{common.settingsPage.cancel:取消}" }
                                      events:
                                        onClick:
                                          - action: overlay.close
                                    - type: Button
                                      props: { text: "$i18n{common.settingsPage.save:保存}", variant: primary, submit: true }
