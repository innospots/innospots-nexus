dsl: "1.0"
page:
  access-mode: grant
  id: role-list
  pageKey: platform-role-main
  title: '$i18n{role.role-list.title:角色管理}'
  name: roleList
  domain: operation
  module: role

state:
  input: ""
  status: ""
  pageNo: 1
  pageSize: 20

dataSources:
  roles:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/platform/roles
      params:
        input: ${state.input}
        status: ${state.status}
        pageNo: ${state.pageNo}
        pageSize: ${state.pageSize}
i18n:
  namespaces:
    - role
body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label:
              '$i18n{role.role-list.system-management:系统管理}'
          - label:
              '$i18n{role.role-list.role-management:角色管理}'
    - type: Flex
      props:
        justify: space-between
        align: center
      children:
        - type: Flex
          props:
            direction: vertical
            gap: 2
          children:
            - type: Typography
              props:
                variant: h3
                text: '$i18n{role.role-list.role-management-2:角色管理}'
            - type: Typography
              props:
                variant: muted
                text: '$i18n{role.role-list.create-roles-configure-resource-permissions-and-bind-users-or-organizati:创建角色、配置其资源权限，并绑定用户或组织单元。}'
        - type: Button
          props:
            text: '$i18n{role.role-list.new-role-2:+ 新建角色}'
            variant: primary
          events:
            onClick:
              - action: overlay.open
                params:
                  overlay:
                    type: modal
                    title: '$i18n{role.role-list.new-role:新建角色}'
                    width: 520
                    content:
                      type: Form
                      props:
                        name: roleCreateForm
                        layout: vertical
                      events:
                        onSubmit:
                          - id: createRoleResult
                            action: request
                            params:
                              method: POST
                              url: /api/d/platform/roles
                              body:
                                roleName: ${event.roleName}
                                roleCode: ${event.roleCode}
                                description: ${event.description}
                          - action: if
                            params:
                              condition: ${actions.createRoleResult != null && actions.createRoleResult.ok == false}
                              then:
                                - id: createRoleErrorMessage
                                  action: request.errorMessage
                                  params:
                                    message: ${actions.createRoleResult.error.message}
                                - action: message
                                  params:
                                    messageType: error
                                    text: ${actions.createRoleErrorMessage}
                              else:
                                - action: message
                                  params:
                                    messageType: success
                                    text: '$i18n{role.role-list.role-created:角色已创建}'
                                - action: overlay.close
                                - action: reload
                                  params:
                                    dataSource: roles
                      children:
                        - type: Field
                          props:
                            label: '$i18n{role.role-list.role-name:角色名称}'
                            required: true
                          children:
                            - type: Input
                              props:
                                name: roleName
                                placeholder: '$i18n{role.role-list.enter-a-role-name:请输入角色名称}'
                                rules:
                                  - required: true
                                    message: '$i18n{role.role-list.enter-a-role-name-2:请输入角色名称}'
                        - type: Field
                          props:
                            label: '$i18n{role.role-list.role-code:角色编码}'
                            required: true
                          children:
                            - type: Input
                              props:
                                name: roleCode
                                placeholder: '$i18n{role.role-list.uppercase-letters-and-underscores-for-example-operator:大写字母与下划线，如 OPERATOR}'
                                rules:
                                  - required: true
                                    message: '$i18n{role.role-list.enter-a-role-code:请输入角色编码}'
                        - type: Field
                          props:
                            label: '$i18n{role.role-list.description:描述}'
                          children:
                            - type: Textarea
                              props:
                                name: description
                                placeholder: '$i18n{role.role-list.role-purpose:角色用途说明}'
                        - type: Flex
                          props:
                            justify: end
                            gap: small
                            className: mt-4
                          children:
                            - type: Button
                              props:
                                text: '$i18n{role.role-list.cancel:取消}'
                              events:
                                onClick:
                                  - action: overlay.close
                            - type: Button
                              props:
                                text: '$i18n{role.role-list.save:保存}'
                                variant: primary
                                submit: true
                                htmlType: submit
    - type: Card
      children:
        - type: Form
          props:
            name: roleSearch
            layout: inline
            initialValues:
              input: ${state.input}
              status: "${state.status == '' ? '__ALL__' : state.status}"
          events:
            onSubmit:
              - action: setState
                params:
                  input: ${event.input}
                  status: "${event.status == '__ALL__' ? '' : event.status}"
                  pageNo: 1
              - action: reload
                params:
                  dataSource: roles
          children:
            - type: Field
              props:
                label: '$i18n{role.role-list.name-code:名称/编码}'
              children:
                - type: Input
                  props:
                    name: input
                    placeholder: '$i18n{role.role-list.fuzzy-search:模糊搜索}'
            - type: Field
              props:
                label: '$i18n{role.role-list.status:状态}'
              children:
                - type: FilterSelect
                  props:
                    name: status
                    placeholder: '$i18n{role.role-list.all-2:全部}'
                    options:
                      - label:
                          '$i18n{role.role-list.all:全部}'
                        value: ""
                      - label:
                          '$i18n{role.role-list.enable:启用}'
                        value: ENABLED
                      - label:
                          '$i18n{role.role-list.disable:禁用}'
                        value: DISABLED
            - type: Field
              props:
                label:  
              children:
                - type: Flex
                  props:
                    gap: small
                  children:
                    - type: Button
                      props:
                        text: '$i18n{role.role-list.search:查询}'
                        submit: true
                        htmlType: submit
                    - type: Button
                      props:
                        text: '$i18n{role.role-list.reset:重置}'
                      events:
                        onClick:
                          - action: form.setValues
                            params:
                              form: roleSearch
                              values:
                                input: ""
                                status: __ALL__
                          - action: setState
                            params:
                              input: ""
                              status: ""
                              pageNo: 1
                          - action: reload
                            params:
                              dataSource: roles
        - type: Table
          props:
            rowKey: roleId
            dataSource: ${data.roles.records}
            loading: ${dataStatus.roles.loading}
            pagination: false
            className: mt-4
            columns:
              - title:
                  '$i18n{role.role-list.role-name-2:角色名称}'
                cell:
                  type: Button
                  props:
                    text: ${row.roleName}
                    variant: link
                    size: small
                  events:
                    onClick:
                      - action: navigate
                        params:
                          to: /system/roles/${row.roleId}
              - title:
                  '$i18n{role.role-list.code:编码}'
                dataIndex: roleCode
              - title:
                  '$i18n{role.role-list.ownership-scope:归属范围}'
                dataIndex: ownerType
              - title:
                  '$i18n{role.role-list.members:成员数}'
                dataIndex: memberCount
              - title:
                  '$i18n{role.role-list.status-2:状态}'
                cell:
                  type: Text
                  props:
                    text: "${row.status == 'ENABLED' ? t('role.role-list.enable') : t('role.role-list.disable')}"
              - title:
                  '$i18n{role.role-list.actions:操作}'
                align: center
                fixed: right
                cell:
                  type: Flex
                  props:
                    justify: center
                    gap: small
                  children:
                    - type: Button
                      props:
                        text: '$i18n{role.role-list.details:详情}'
                        variant: link
                        size: small
                      events:
                        onClick:
                          - action: navigate
                            params:
                              to: /system/roles/${row.roleId}
                    - type: Button
                      props:
                        text: "${row.status == 'ENABLED' ? t('role.role-list.disable') : t('role.role-list.enable')}"
                        variant: link
                        size: small
                      events:
                        onClick:
                          - action: confirm
                            params:
                              title: '$i18n{role.role-list.confirm-status-change:确认变更状态}'
                              content: '$i18n{role.role-list.change-this-role-s-enabled-state:确定要变更该角色的启用状态吗？}'
                          - action: request
                            params:
                              method: PUT
                              url: /api/d/platform/roles/${row.roleId}/status
                              body:
                                status: "${row.status == 'ENABLED' ? 'DISABLED' : 'ENABLED'}"
                          - action: message
                            params:
                              messageType: success
                              text: '$i18n{role.role-list.status-updated:状态已更新}'
                          - action: reload
                            params:
                              dataSource: roles
                    - type: Button
                      props:
                        text: '$i18n{role.role-list.delete:删除}'
                        variant: link
                        size: small
                        danger: true
                      events:
                        onClick:
                          - action: confirm
                            params:
                              title: '$i18n{role.role-list.delete-role:删除角色}'
                              content: '$i18n{role.role-list.this-removes-the-role-s-authorizations-and-member-bindings-delete-it:将解除该角色的授权与成员绑定，确定删除吗？}'
                          - action: request
                            params:
                              method: DELETE
                              url: /api/d/platform/roles/${row.roleId}
                          - action: message
                            params:
                              messageType: success
                              text: '$i18n{role.role-list.deleted:已删除}'
                          - action: reload
                            params:
                              dataSource: roles
        - type: Pagination
          props:
            total: ${data.roles.total}
            page: ${state.pageNo}
            pageSize: ${state.pageSize}
            pageSizeOptions: [10, 20, 50]
            align: right
            className: mt-3
          events:
            onChange:
              - action: setState
                params:
                  pageNo: ${event}
              - action: reload
                params:
                  dataSource: roles
            onPageSizeChange:
              - action: setState
                params:
                  pageSize: ${event}
