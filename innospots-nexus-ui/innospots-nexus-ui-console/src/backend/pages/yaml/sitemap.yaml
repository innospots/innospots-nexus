# Nexus 管理控制台 Sitemap（PRD prd-diagram；业务 API 多为 /api/d/platform/*，插件与目录仍为 /api/d/nexus/*）
id: site
resourceType: sitemap
version: 1
dslVersion: "1.0"
app: { name: Nexus Console }
auth: { loginPath: /login }

pages:
  - {
      id: login,
      path: /login,
      title: 登录,
      version: 1,
      lazy: true,
      layout: login
    }
  - {
      id: password-reset,
      path: /password/reset,
      title: 找回密码,
      version: 1,
      lazy: true,
      layout: login
    }
  - {
      id: pending-approval,
      path: /pending-approval,
      title: 注册待审核,
      version: 1,
      lazy: true,
      layout: login
    }
  - {
      id: password-change,
      path: /account/password,
      title: 修改密码,
      version: 1,
      lazy: true,
      layout: admin
    }
  - {
      id: invite-accept,
      path: /invite/:token,
      title: 接受邀请,
      version: 1,
      lazy: true,
      layout: login
    }
  - {
      id: invite-activate,
      path: /register/invite,
      title: 邀请码注册,
      version: 1,
      lazy: true,
      layout: login
    }
  - {
      id: open-registration,
      path: /register/open,
      title: 开放注册,
      version: 1,
      lazy: true,
      layout: login
    }
  - {
      id: access-registration,
      path: /register/approval,
      title: 注册待审核,
      version: 1,
      lazy: true,
      layout: login
    }
  - {
      id: dashboard,
      path: /,
      title: 工作台,
      version: 1,
      lazy: true,


    }
  - {
      id: role-list,
      path: /system/roles,
      title: 角色管理,
      version: 1,
      lazy: true,


    }
  - {
      id: role-detail-basic,
      path: /system/roles/:roleId,
      title: 角色详情,
      version: 2,
      lazy: true,
      layout: admin,
      activeMenu: nav-roles,


    }
  - {
      id: role-detail-permissions,
      path: /system/roles/:roleId/permissions,
      title: 角色权限设置,
      version: 1,
      lazy: true,
      layout: admin,
      activeMenu: nav-roles,


    }
  - {
      id: role-detail-members,
      path: /system/roles/:roleId/members,
      title: 角色成员列表,
      version: 1,
      lazy: true,
      layout: admin,
      activeMenu: nav-roles,


    }
  - {
      id: dictionary-type-list,
      path: /system/dictionaries,
      title: 数据字典,
      version: 1,
      lazy: true,


    }
  - {
      id: dictionary-type-create,
      path: /system/dictionaries/create,
      title: 新建字典,
      version: 1,
      lazy: true,
      layout: admin,
      activeMenu: nav-dictionaries,



    }
  - {
      id: dictionary-type-detail,
      path: /system/dictionaries/:dictionaryTypeId,
      title: 字典详情,
      version: 1,
      lazy: true,
      layout: admin,
      activeMenu: nav-dictionaries,


    }
  - {
      id: audit-log-list,
      path: /system/audit-logs,
      title: 审计日志,
      version: 1,
      lazy: true,


    }
  - {
      id: audit-log-detail,
      path: /system/audit-logs/:logId,
      title: 审计日志详情,
      version: 1,
      lazy: true,
      layout: admin,
      activeMenu: nav-audit,


    }
  - {
      id: plugin-list,
      path: /system/plugins,
      title: 插件管理,
      version: 1,
      lazy: true,


    }
  - {
      id: plugin-detail,
      path: /system/plugins/:pluginId,
      title: 插件详情,
      version: 1,
      lazy: true,
      layout: admin,
      activeMenu: nav-plugins,


    }
  - {
      id: platform-user-list,
      path: /ops/platform-users,
      title: 用户列表,
      version: 1,
      lazy: true,


    }
  - {
      id: platform-user-create,
      path: /ops/platform-users/create,
      title: 添加平台用户,
      version: 1,
      lazy: true,
      layout: admin,
      activeMenu: nav-platform-users,



    }
  - {
      id: platform-user-detail,
      path: /ops/platform-users/:platformUserId,
      title: 平台用户详情,
      version: 1,
      lazy: true,
      layout: admin,
      activeMenu: nav-platform-users,


    }
  - {
      id: platform-invite-list,
      path: /ops/platform-users/invites,
      title: 邀请列表,
      version: 1,
      lazy: true,


    }
  - {
      id: platform-access-request-list,
      path: /ops/platform-users/access-requests,
      title: 注册审批,
      version: 1,
      lazy: true,


    }
  - {
      id: tenant-list,
      path: /ops/organization/tenants,
      title: 租户管理,
      version: 1,
      lazy: true,


    }
  - {
      id: tenant-detail,
      path: /ops/organization/tenants/:tenantId,
      title: 租户详情,
      version: 1,
      lazy: true,
      layout: admin,
      activeMenu: nav-organization-tenants,


    }
  - {
      id: system-settings,
      path: /system/settings/general,
      title: 系统设置,
      version: 1,
      lazy: true,


    }
  - {
      id: themes,
      path: /system/settings/themes,
      title: 主题选择,
      version: 1,
      lazy: true,


    }

layouts:
  admin:
    dsl: "1.0"
    body:
      type: Layout
      props: { className: shell-root }
      children:
        - type: NavigationShell
          props:
            user: ${data.session.user}
            menus: ${data.session.menus}
          children:
            - type: Content
              props: { className: shell-content }
              children:
                - type: PageOutlet
  login:
    dsl: "1.0"
    body:
      type: PageOutlet
  blank:
    dsl: "1.0"
    body:
      type: PageOutlet
