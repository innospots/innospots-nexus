dsl: "1.0"
page:
  id: platform-user-list
  title: '$i18n{platform-user.platform-user-list.title:用户列表}'
  name: platformUserList

state:
  input: ""
  status: ""
  pageNo: 1
  pageSize: 20

dataSources:
  users:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/platform/users
      params:
        input: ${state.input}
        status: ${state.status}
        pageNo: ${state.pageNo}
        pageSize: ${state.pageSize}
i18n:
  namespaces:
    - platform-user
body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label:
              '$i18n{platform-user.platform-user-list.operations:运营管理}'
          - label:
              '$i18n{platform-user.platform-user-list.user-list:用户列表}'
    - type: Flex
      props:
        className: mt-2
        justify: space-between
        align: center
      children:
        - type: Flex
          props:
            direction: vertical
            gap: 2
          children:
            - type: Typography
              props:
                variant: h3
                text: '$i18n{platform-user.platform-user-list.user-list-2:用户列表}'
            - type: Typography
              props:
                variant: muted
                text: '$i18n{platform-user.platform-user-list.review-platform-operations-accounts-and-open-details-use-the-status-filt:查询平台域运营账号并进入详情；待审核用户见状态筛选。}'
        - type: Button
          props:
            text: '$i18n{platform-user.platform-user-list.add-user:+ 添加用户}'
            variant: primary
          events:
            onClick:
              - action: navigate
                params:
                  to: /ops/platform-users/create
    - type: Card
      children:
        - type: Form
          props:
            name: platformUserSearch
            layout: inline
            initialValues:
              input: ${state.input}
              status: "${state.status == '' ? '__ALL__' : state.status}"
          events:
            onSubmit:
              - action: setState
                params:
                  input: ${event.input}
                  status: "${event.status == '__ALL__' ? '' : event.status}"
                  pageNo: 1
              - action: reload
                params:
                  dataSource: users
          children:
            - type: Field
              props:
                label: '$i18n{platform-user.platform-user-list.login-name-display-name:登录名/姓名}'
              children:
                - type: Input
                  props:
                    name: input
                    placeholder: '$i18n{platform-user.platform-user-list.match-login-or-display-name:匹配登录名或显示名称}'
            - type: Field
              props:
                label: '$i18n{platform-user.platform-user-list.status:状态}'
              children:
                - type: FilterSelect
                  props:
                    name: status
                    placeholder: '$i18n{platform-user.platform-user-list.all-2:全部}'
                    options:
                      - label:
                          '$i18n{platform-user.platform-user-list.all:全部}'
                        value: ""
                      - label:
                          '$i18n{platform-user.platform-user-list.active:正常}'
                        value: ACTIVE
                      - label:
                          '$i18n{platform-user.platform-user-list.pending-approval:待审核}'
                        value: PENDING_APPROVAL
                      - label:
                          '$i18n{platform-user.platform-user-list.pending-activation:待激活}'
                        value: PENDING_ACTIVATION
                      - label:
                          '$i18n{platform-user.platform-user-list.disable:禁用}'
                        value: DISABLED
                      - label:
                          '$i18n{platform-user.platform-user-list.locked:锁定}'
                        value: LOCKED
            - type: Field
              props:
                label:  
              children:
                - type: Flex
                  props:
                    gap: small
                  children:
                    - type: Button
                      props:
                        text: '$i18n{platform-user.platform-user-list.search:查询}'
                        submit: true
                        htmlType: submit
                    - type: Button
                      props:
                        text: '$i18n{platform-user.platform-user-list.reset:重置}'
                      events:
                        onClick:
                          - action: form.setValues
                            params:
                              form: platformUserSearch
                              values:
                                input: ""
                                status: __ALL__
                          - action: setState
                            params:
                              input: ""
                              status: ""
                              pageNo: 1
                          - action: reload
                            params:
                              dataSource: users
        - type: Table
          props:
            rowKey: platformUserId
            dataSource: ${data.users.records}
            loading: ${dataStatus.users.loading}
            className: mt-4
            columns:
              - title:
                  '$i18n{platform-user.platform-user-list.login-name:登录名}'
                dataIndex: loginName
              - title:
                  '$i18n{platform-user.platform-user-list.display-name:显示名称}'
                dataIndex: displayName
              - title:
                  '$i18n{platform-user.platform-user-list.email:邮箱}'
                dataIndex: email
              - title:
                  '$i18n{platform-user.platform-user-list.mobile:手机}'
                dataIndex: mobile
              - title:
                  '$i18n{platform-user.platform-user-list.status-2:状态}'
                cell:
                  type: Text
                  props:
                    text: "${row.status == 'ACTIVE' ? t('platform-user.platform-user-list.status.active') : row.status == 'PENDING_APPROVAL'
                      ? t('platform-user.platform-user-list.status.pending-approval') : row.status ==
                      'PENDING_ACTIVATION' ? t('platform-user.platform-user-list.status.pending-activation') :
                      row.status == 'DISABLED' ? t('platform-user.platform-user-list.status.disabled') : row.status ==
                      'LOCKED' ? t('platform-user.platform-user-list.status.locked') : row.status}"
              - title:
                  '$i18n{platform-user.platform-user-list.actions:操作}'
                cell:
                  type: Flex
                  props:
                    gap: small
                  children:
                    - type: Button
                      props:
                        text: '$i18n{platform-user.platform-user-list.details:详情}'
                        variant: link
                        size: small
                      events:
                        onClick:
                          - action: navigate
                            params:
                              to: /ops/platform-users/${row.platformUserId}
                    - type: Button
                      when: ${row.status == 'ACTIVE' || row.status == 'DISABLED'}
                      props:
                        text: "${row.status == 'ACTIVE' ? t('platform-user.platform-user-list.disable') :
                          t('platform-user.platform-user-list.enable')}"
                        variant: link
                        size: small
                      events:
                        onClick:
                          - action: confirm
                            params:
                              title: '$i18n{platform-user.platform-user-list.confirm-status-change:确认变更状态}'
                              content: '$i18n{platform-user.platform-user-list.change-this-user-s-enabled-state:确定要变更该用户的启用状态吗？}'
                          - action: request
                            params:
                              method: PUT
                              url: /api/d/platform/users/${row.platformUserId}/status
                              body:
                                status: "${row.status == 'ACTIVE' ? 'DISABLED' : 'ACTIVE'}"
                          - action: message
                            params:
                              messageType: success
                              text: '$i18n{platform-user.platform-user-list.status-updated:状态已更新}'
                          - action: reload
                            params:
                              dataSource: users
        - type: Text
          props:
            text: "${t('platform-user.platform-user-list.summary.count', { count: data.users.total })}"
            type: secondary
            className: mt-3
