dsl: "1.0"
page:
  id: platform-user-detail
  title: '$i18n{platform-user.platform-user-detail.title:平台用户详情}'
  name: platformUserDetail

state:
  editing: false

dataSources:
  user:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/platform/users/${params.platformUserId}
i18n:
  namespaces:
    - platform-user
lifecycle:
  onLoad:
    - action: form.setValues
      params:
        form: platformUserEditForm
        values: ${data.user}
  onShow:
    - action: reload
      params:
        dataSource: user
    - action: form.setValues
      params:
        form: platformUserEditForm
        values: ${data.user}
body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label:
              '$i18n{platform-user.platform-user-detail.operations:运营管理}'
          - label:
              '$i18n{platform-user.platform-user-detail.user-list:用户列表}'
            href: /ops/platform-users
          - label: "${data.user != null && data.user.loginName != null ? data.user.loginName : params.platformUserId}"
    - type: Button
      props:
        text: '$i18n{platform-user.platform-user-detail.back-to-users:← 返回用户列表}'
        variant: link
      events:
        onClick:
          - action: navigate
            params:
              to: /ops/platform-users
    - type: Flex
      when: ${data.user != null}
      props:
        justify: space-between
        align: start
        className: mt-2
      children:
        - type: Flex
          props:
            direction: vertical
            gap: small
          children:
            - type: Typography
              props:
                variant: h3
                text: "${data.user.displayName != null && data.user.displayName != '' ? data.user.displayName : data.user.loginName}"
            - type: Typography
              props:
                variant: muted
                text: "${t('platform-user.platform-user-detail.login-status', { loginName: data.user.loginName, status: data.user.status
                  == 'ACTIVE' ? t('platform-user.platform-user-detail.status.active') : data.user.status ==
                  'PENDING_APPROVAL' ? t('platform-user.platform-user-detail.status.pending-approval') :
                  data.user.status == 'DISABLED' ? t('platform-user.platform-user-detail.status.disabled') :
                  data.user.status })}"
            - type: Alert
              when: ${data.user.status == 'PENDING_APPROVAL'}
              props:
                variant: info
                message: '$i18n{platform-user.platform-user-detail.this-user-is-pending-approval-complete-the-registration-approval-workflo:该用户处于待审核状态，请通过注册审批流程处理后再启用为正常状态。}'
        - type: Flex
          props:
            gap: small
          children:
            - type: Button
              when: ${data.user.status == 'ACTIVE' || data.user.status == 'DISABLED'}
              props:
                text: "${data.user.status == 'ACTIVE' ? t('platform-user.platform-user-detail.disable') :
                  t('platform-user.platform-user-detail.enable')}"
              events:
                onClick:
                  - action: confirm
                    params:
                      title: '$i18n{platform-user.platform-user-detail.confirm-status-change:确认变更状态}'
                      content: '$i18n{platform-user.platform-user-detail.change-this-user-s-enabled-state:确定要变更该用户的启用状态吗？}'
                  - action: request
                    params:
                      method: PUT
                      url: /api/d/platform/users/${params.platformUserId}/status
                      body:
                        status: "${data.user.status == 'ACTIVE' ? 'DISABLED' : 'ACTIVE'}"
                  - action: message
                    params:
                      messageType: success
                      text: '$i18n{platform-user.platform-user-detail.status-updated:状态已更新}'
                  - action: reload
                    params:
                      dataSource: user
            - type: Button
              props:
                text: '$i18n{platform-user.platform-user-detail.reset-password-2:重置密码}'
              events:
                onClick:
                  - action: overlay.open
                    params:
                      overlay:
                        type: modal
                        title: '$i18n{platform-user.platform-user-detail.reset-password:重置密码}'
                        width: 480
                        content:
                          type: PlatformUserPasswordResetPanel
                          props:
                            platformUserId: ${data.user.platformUserId}
                          events:
                            onCancel:
                              - action: overlay.close
                            onSuccess:
                              - action: message
                                params:
                                  messageType: success
                                  text: '$i18n{platform-user.platform-user-detail.password-reset:密码已重置}'
                              - action: overlay.close
            - type: Button
              props:
                text: "${state.editing ? t('platform-user.platform-user-detail.cancel-editing') :
                  t('platform-user.platform-user-detail.edit')}"
                variant: primary
              events:
                onClick:
                  - action: if
                    params:
                      condition: ${state.editing}
                      then:
                        - action: setState
                          params:
                            editing: false
                        - action: form.setValues
                          params:
                            form: platformUserEditForm
                            values: ${data.user}
                      else:
                        - action: setState
                          params:
                            editing: true
    - type: Card
      when: ${data.user != null}
      props:
        className: mt-4
      children:
        - type: Text
          props:
            text: '$i18n{platform-user.platform-user-detail.basic-information:基本信息}'
            strong: true
        - type: Descriptions
          when: ${!state.editing}
          props:
            className: mt-3
            items:
              - label:
                  '$i18n{platform-user.platform-user-detail.user-id:用户 ID}'
                value: ${data.user.platformUserId}
              - label:
                  '$i18n{platform-user.platform-user-detail.login-name:登录名}'
                value: ${data.user.loginName}
              - label:
                  '$i18n{platform-user.platform-user-detail.display-name:显示名称}'
                value: "${data.user.displayName != null ? data.user.displayName : '—'}"
              - label:
                  '$i18n{platform-user.platform-user-detail.email:邮箱}'
                value: "${data.user.email != null ? data.user.email : '—'}"
              - label:
                  '$i18n{platform-user.platform-user-detail.mobile:手机}'
                value: "${data.user.mobile != null ? data.user.mobile : '—'}"
        - type: Form
          when: ${state.editing}
          props:
            name: platformUserEditForm
            layout: vertical
            className: mt-3
            initialValues: ${data.user}
          events:
            onSubmit:
              - action: request
                params:
                  method: PUT
                  url: /api/d/platform/users/${params.platformUserId}
                  body:
                    displayName: ${event.displayName}
                    email: ${event.email}
                    mobile: ${event.mobile}
              - action: message
                params:
                  messageType: success
                  text: '$i18n{platform-user.platform-user-detail.changes-saved:已保存修改}'
              - action: setState
                params:
                  editing: false
              - action: reload
                params:
                  dataSource: user
          children:
            - type: Field
              props:
                label: '$i18n{platform-user.platform-user-detail.display-name-2:显示名称}'
              children:
                - type: Input
                  props:
                    name: displayName
            - type: Grid
              props:
                columns: 2
                gap: 16
              children:
                - type: Field
                  props:
                    label: '$i18n{platform-user.platform-user-detail.email-2:邮箱}'
                  children:
                    - type: Input
                      props:
                        name: email
                - type: Field
                  props:
                    label: '$i18n{platform-user.platform-user-detail.mobile-2:手机}'
                  children:
                    - type: Input
                      props:
                        name: mobile
            - type: Flex
              props:
                justify: end
                gap: small
              children:
                - type: Button
                  props:
                    text: '$i18n{platform-user.platform-user-detail.save-changes:保存修改}'
                    variant: primary
                    submit: true
                    htmlType: submit
    - type: Card
      when: ${data.user != null}
      props:
        className: mt-4
      children:
        - type: Text
          props:
            text: '$i18n{platform-user.platform-user-detail.login-information:登录信息}'
            strong: true
        - type: Descriptions
          props:
            className: mt-3
            items:
              - label:
                  '$i18n{platform-user.platform-user-detail.last-sign-in:上次登录}'
                value: "${data.user.lastLoginTime != null ? data.user.lastLoginTime + (data.user.lastLoginIp != null ? ' · ' +
                  data.user.lastLoginIp : '') : '—'}"
              - label:
                  '$i18n{platform-user.platform-user-detail.created-at:创建时间}'
                value: "${data.user.createdAt != null ? data.user.createdAt : '—'}"
    - type: Card
      when: ${data.user != null}
      props:
        className: mt-4
      children:
        - type: Text
          props:
            text: '$i18n{platform-user.platform-user-detail.role-console:角色（Console）}'
            strong: true
