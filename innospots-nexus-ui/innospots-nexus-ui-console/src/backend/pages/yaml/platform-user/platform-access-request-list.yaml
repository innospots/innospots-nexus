dsl: "1.0"
page:
  id: platform-access-request-list
  title: '$i18n{platform-user.platform-access-request-list.title:注册审批}'
  name: platformAccessRequestList

state:
  status: PENDING_APPROVAL
  pageNo: 1
  pageSize: 20
  approveRequestId: ""
  rejectRequestId: ""

dataSources:
  accessRequests:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/platform/registration/access-requests
      params:
        status: ${state.status}
        pageNo: ${state.pageNo}
        pageSize: ${state.pageSize}
i18n:
  namespaces:
    - platform-user
body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label:
              '$i18n{platform-user.platform-access-request-list.operations:运营管理}'
          - label:
              '$i18n{platform-user.platform-access-request-list.registration-approval:注册审批}'
    - type: Flex
      props:
        direction: vertical
        gap: 2
        className: mt-2
      children:
        - type: Typography
          props:
            variant: h3
            text: '$i18n{platform-user.platform-access-request-list.registration-approval-2:注册审批}'
        - type: Typography
          props:
            variant: muted
            text: '$i18n{platform-user.platform-access-request-list.review-pending-self-registration-accounts-items-appear-only-when-registr:处理自助注册产生的待审核账号；仅 registration.mode=APPROVAL 时有待办数据。}'
    - type: Card
      children:
        - type: Form
          props:
            name: accessRequestSearch
            layout: inline
            initialValues:
              status: "${state.status == '' ? '__ALL__' : state.status}"
          events:
            onSubmit:
              - action: setState
                params:
                  status: "${event.status == '__ALL__' ? '' : event.status}"
                  pageNo: 1
              - action: reload
                params:
                  dataSource: accessRequests
          children:
            - type: Field
              props:
                label: '$i18n{platform-user.platform-access-request-list.status:状态}'
              children:
                - type: FilterSelect
                  props:
                    name: status
                    placeholder: '$i18n{platform-user.platform-access-request-list.pending-approval-2:待审批}'
                    options:
                      - label:
                          '$i18n{platform-user.platform-access-request-list.pending-approval:待审批}'
                        value: PENDING_APPROVAL
                      - label:
                          '$i18n{platform-user.platform-access-request-list.approved:已通过}'
                        value: APPROVED
                      - label:
                          '$i18n{platform-user.platform-access-request-list.rejected:已拒绝}'
                        value: REJECTED
                      - label:
                          '$i18n{platform-user.platform-access-request-list.all:全部}'
                        value: ""
            - type: Field
              props:
                label:  
              children:
                - type: Button
                  props:
                    text: '$i18n{platform-user.platform-access-request-list.search:查询}'
                    submit: true
                    htmlType: submit
        - type: Table
          props:
            rowKey: accessRequestId
            dataSource: ${data.accessRequests.records}
            loading: ${dataStatus.accessRequests.loading}
            className: mt-4
            columns:
              - title:
                  '$i18n{platform-user.platform-access-request-list.login-name:登录名}'
                dataIndex: loginName
              - title:
                  '$i18n{platform-user.platform-access-request-list.applicant:申请人}'
                dataIndex: applicantName
              - title:
                  '$i18n{platform-user.platform-access-request-list.email-mobile:邮箱/手机}'
                cell:
                  type: Text
                  props:
                    text: "${row.email != null && row.email != '' ? row.email : (row.mobile != null ? row.mobile : '—')}"
              - title:
                  '$i18n{platform-user.platform-access-request-list.registered-at:注册时间}'
                dataIndex: createdAt
              - title:
                  '$i18n{platform-user.platform-access-request-list.description:说明}'
                dataIndex: description
              - title:
                  '$i18n{platform-user.platform-access-request-list.status-2:状态}'
                cell:
                  type: Text
                  props:
                    text: "${row.status == 'PENDING_APPROVAL' ? t('platform-user.platform-access-request-list.status.pending-approval') :
                      row.status == 'APPROVED' ? t('platform-user.platform-access-request-list.status.approved') :
                      row.status == 'REJECTED' ? t('platform-user.platform-access-request-list.status.rejected') :
                      row.status}"
              - title:
                  '$i18n{platform-user.platform-access-request-list.actions:操作}'
                cell:
                  type: Flex
                  props:
                    gap: small
                  children:
                    - type: Button
                      when: ${row.status == 'PENDING_APPROVAL'}
                      props:
                        text: '$i18n{platform-user.platform-access-request-list.approve:通过}'
                        variant: link
                        size: small
                      events:
                        onClick:
                          - action: setState
                            params:
                              approveRequestId: ${row.accessRequestId}
                          - action: overlay.open
                            params:
                              overlay:
                                type: drawer
                                title: '$i18n{platform-user.platform-access-request-list.approve-registration-request:通过注册申请}'
                                width: 480
                                content:
                                  type: Form
                                  props:
                                    name: accessApproveForm
                                    layout: vertical
                                  events:
                                    onSubmit:
                                      - action: request
                                        params:
                                          method: POST
                                          url: /api/d/platform/registration/access-requests/${state.approveRequestId}/approve
                                          body:
                                            defaultRoleCodes: ${event.defaultRoleCodes}
                                      - action: message
                                        params:
                                          messageType: success
                                          text: '$i18n{platform-user.platform-access-request-list.approved-account-enabled:已通过，账号已启用}'
                                      - action: overlay.close
                                      - action: reload
                                        params:
                                          dataSource: accessRequests
                                  children:
                                    - type: Field
                                      props:
                                        label: '$i18n{platform-user.platform-access-request-list.default-roles-optional:默认角色（可选）}'
                                        labelHint: '$i18n{platform-user.platform-access-request-list.comma-separated-role-codes:逗号分隔角色编码}'
                                      children:
                                        - type: Input
                                          props:
                                            name: defaultRoleCodes
                                            placeholder: '$i18n{platform-user.platform-access-request-list.e-g-platform-operator:如 PLATFORM_OPERATOR}'
                                    - type: Flex
                                      props:
                                        justify: end
                                        gap: small
                                        className: mt-4
                                      children:
                                        - type: Button
                                          props:
                                            text: '$i18n{platform-user.platform-access-request-list.cancel:取消}'
                                          events:
                                            onClick:
                                              - action: overlay.close
                                        - type: Button
                                          props:
                                            text: '$i18n{platform-user.platform-access-request-list.confirm-approval:确认通过}'
                                            variant: primary
                                            submit: true
                                            htmlType: submit
                    - type: Button
                      when: ${row.status == 'PENDING_APPROVAL'}
                      props:
                        text: '$i18n{platform-user.platform-access-request-list.reject:拒绝}'
                        variant: link
                        size: small
                        danger: true
                      events:
                        onClick:
                          - action: setState
                            params:
                              rejectRequestId: ${row.accessRequestId}
                          - action: overlay.open
                            params:
                              overlay:
                                type: drawer
                                title: '$i18n{platform-user.platform-access-request-list.reject-registration-request:拒绝注册申请}'
                                width: 480
                                content:
                                  type: Form
                                  props:
                                    name: accessRejectForm
                                    layout: vertical
                                  events:
                                    onSubmit:
                                      - action: request
                                        params:
                                          method: POST
                                          url: /api/d/platform/registration/access-requests/${state.rejectRequestId}/reject
                                          body:
                                            rejectReason: ${event.rejectReason}
                                      - action: message
                                        params:
                                          messageType: success
                                          text: '$i18n{platform-user.platform-access-request-list.request-rejected:已拒绝该申请}'
                                      - action: overlay.close
                                      - action: reload
                                        params:
                                          dataSource: accessRequests
                                  children:
                                    - type: Field
                                      props:
                                        label: '$i18n{platform-user.platform-access-request-list.rejection-reason:拒绝原因}'
                                        labelHint: '$i18n{platform-user.platform-access-request-list.optional-the-applicant-will-be-notified:可选，将通知申请人}'
                                      children:
                                        - type: Textarea
                                          props:
                                            name: rejectReason
                                            placeholder: '$i18n{platform-user.platform-access-request-list.enter-a-rejection-reason:请填写拒绝原因}'
                                    - type: Flex
                                      props:
                                        justify: end
                                        gap: small
                                        className: mt-4
                                      children:
                                        - type: Button
                                          props:
                                            text: '$i18n{platform-user.platform-access-request-list.cancel-2:取消}'
                                          events:
                                            onClick:
                                              - action: overlay.close
                                        - type: Button
                                          props:
                                            text: '$i18n{platform-user.platform-access-request-list.confirm-rejection:确认拒绝}'
                                            variant: primary
                                            danger: true
                                            submit: true
                                            htmlType: submit
                    - type: Button
                      when: ${row.platformUserId != null && row.platformUserId != ''}
                      props:
                        text: '$i18n{platform-user.platform-access-request-list.user-details:用户详情}'
                        variant: link
                        size: small
                      events:
                        onClick:
                          - action: navigate
                            params:
                              to: /ops/platform-users/${row.platformUserId}
        - type: Text
          props:
            text: "${t('platform-user.platform-access-request-list.summary.count', { count: data.accessRequests.total })}"
            type: secondary
            className: mt-3
