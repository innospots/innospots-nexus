dsl: "1.0"
page:
  id: tenant-list
  title: '$i18n{organization.tenant-list.title:租户管理}'
  name: tenantList

state:
  input: ""
  tenantType: ""
  status: ""
  pageNo: 1
  pageSize: 20

dataSources:
  tenants:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/platform/tenants
      params:
        input: ${state.input}
        tenantType: ${state.tenantType}
        status: ${state.status}
        pageNo: ${state.pageNo}
        pageSize: ${state.pageSize}
i18n:
  namespaces:
    - organization
body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label:
              '$i18n{organization.tenant-list.operations:运营管理}'
          - label:
              '$i18n{organization.tenant-list.tenant-management:租户管理}'
    - type: Flex
      props:
        justify: space-between
        align: center
      children:
        - type: Flex
          props:
            direction: vertical
            gap: 2
          children:
            - type: Typography
              props:
                variant: h3
                text: '$i18n{organization.tenant-list.tenant-management-2:租户管理}'
            - type: Typography
              props:
                variant: muted
                text: '$i18n{organization.tenant-list.manage-tenant-identity-and-lifecycle-state:管理租户身份与生命周期状态。}'
        - type: Button
          props:
            text: '$i18n{organization.tenant-list.open-tenant-2:+ 开通租户}'
            variant: primary
          events:
            onClick:
              - action: overlay.open
                params:
                  overlay:
                    type: modal
                    title: '$i18n{organization.tenant-list.open-tenant:开通租户}'
                    width: 520
                    content:
                      type: Form
                      props:
                        name: tenantCreateForm
                        layout: vertical
                      events:
                        onSubmit:
                          - action: validate.tenantCode
                            params:
                              value: ${event.tenantCode}
                          - action: request
                            params:
                              method: POST
                              url: /api/d/platform/tenants
                              body:
                                tenantName: ${event.tenantName}
                                tenantCode: ${event.tenantCode}
                                tenantType: ${event.tenantType}
                          - action: message
                            params:
                              messageType: success
                              text: '$i18n{organization.tenant-list.tenant-opened:租户已开通}'
                          - action: overlay.close
                          - action: reload
                            params:
                              dataSource: tenants
                      children:
                        - type: Field
                          props:
                            label: '$i18n{organization.tenant-list.tenant-name:租户名称}'
                            required: true
                          children:
                            - type: Input
                              props:
                                name: tenantName
                                placeholder: '$i18n{organization.tenant-list.enter-a-tenant-display-name:请输入租户显示名称}'
                                rules:
                                  - required: true
                                    message: '$i18n{organization.tenant-list.enter-a-tenant-name:请输入租户名称}'
                        - type: Field
                          props:
                            label: '$i18n{organization.tenant-list.tenant-type:租户类型}'
                            required: true
                          children:
                            - type: Select
                              props:
                                name: tenantType
                                placeholder: '$i18n{organization.tenant-list.select:请选择}'
                                options:
                                  - label:
                                      '$i18n{organization.tenant-list.enterprise-customer:企业客户}'
                                    value: ENTERPRISE
                                  - label:
                                      '$i18n{organization.tenant-list.team:团队}'
                                    value: TEAM
                                  - label:
                                      '$i18n{organization.tenant-list.individual:个人}'
                                    value: INDIVIDUAL
                                rules:
                                  - required: true
                                    message: '$i18n{organization.tenant-list.select-a-tenant-type:请选择租户类型}'
                        - type: Field
                          props:
                            label: '$i18n{organization.tenant-list.unique-code:唯一编码}'
                            required: true
                            labelHint: '$i18n{organization.tenant-list.letters-numbers-and-underscores-immutable-after-creation:字母、数字、下划线；创建后不可修改}'
                          children:
                            - type: Input
                              props:
                                name: tenantCode
                                placeholder: '$i18n{organization.tenant-list.e-g-acme-corp:如 acme_corp}'
                                rules:
                                  - required: true
                                    message: '$i18n{organization.tenant-list.enter-a-unique-code:请输入唯一编码}'
                        - type: Flex
                          props:
                            justify: end
                            gap: small
                            className: mt-4
                          children:
                            - type: Button
                              props:
                                text: '$i18n{organization.tenant-list.cancel:取消}'
                              events:
                                onClick:
                                  - action: overlay.close
                            - type: Button
                              props:
                                text: '$i18n{organization.tenant-list.confirm-provisioning:确认开通}'
                                variant: primary
                                submit: true
                                htmlType: submit
    - type: Card
      children:
        - type: Form
          props:
            name: tenantSearch
            layout: inline
            initialValues:
              input: ${state.input}
              tenantType: "${state.tenantType == '' ? '__ALL__' : state.tenantType}"
              status: "${state.status == '' ? '__ALL__' : state.status}"
          events:
            onSubmit:
              - action: setState
                params:
                  input: ${event.input}
                  tenantType: "${event.tenantType == '__ALL__' ? '' : event.tenantType}"
                  status: "${event.status == '__ALL__' ? '' : event.status}"
                  pageNo: 1
              - action: reload
                params:
                  dataSource: tenants
          children:
            - type: Field
              props:
                label: '$i18n{organization.tenant-list.name-code:名称/编码}'
              children:
                - type: Input
                  props:
                    name: input
                    placeholder: '$i18n{organization.tenant-list.fuzzy-match-tenant-name-or-code:模糊匹配租户名称或编码}'
            - type: Field
              props:
                label: '$i18n{organization.tenant-list.type:类型}'
              children:
                - type: FilterSelect
                  props:
                    name: tenantType
                    placeholder: '$i18n{organization.tenant-list.all-2:全部}'
                    options:
                      - label:
                          '$i18n{organization.tenant-list.all:全部}'
                        value: ""
                      - label:
                          '$i18n{organization.tenant-list.enterprise:企业}'
                        value: ENTERPRISE
                      - label:
                          '$i18n{organization.tenant-list.team-2:团队}'
                        value: TEAM
                      - label:
                          '$i18n{organization.tenant-list.individual-2:个人}'
                        value: INDIVIDUAL
            - type: Field
              props:
                label: '$i18n{organization.tenant-list.status:状态}'
              children:
                - type: FilterSelect
                  props:
                    name: status
                    placeholder: '$i18n{organization.tenant-list.all-4:全部}'
                    options:
                      - label:
                          '$i18n{organization.tenant-list.all-3:全部}'
                        value: ""
                      - label:
                          '$i18n{organization.tenant-list.active:正常}'
                        value: ACTIVE
                      - label:
                          '$i18n{organization.tenant-list.suspend:暂停}'
                        value: SUSPENDED
                      - label:
                          '$i18n{organization.tenant-list.archive:归档}'
                        value: ARCHIVED
            - type: Field
              props:
                label:  
              children:
                - type: Flex
                  props:
                    gap: small
                  children:
                    - type: Button
                      props:
                        text: '$i18n{organization.tenant-list.search:查询}'
                        submit: true
                        htmlType: submit
                    - type: Button
                      props:
                        text: '$i18n{organization.tenant-list.reset:重置}'
                      events:
                        onClick:
                          - action: form.setValues
                            params:
                              form: tenantSearch
                              values:
                                input: ""
                                tenantType: __ALL__
                                status: __ALL__
                          - action: setState
                            params:
                              input: ""
                              tenantType: ""
                              status: ""
                              pageNo: 1
                          - action: reload
                            params:
                              dataSource: tenants
        - type: Table
          props:
            rowKey: tenantId
            dataSource: ${data.tenants.records}
            loading: ${dataStatus.tenants.loading}
            className: mt-4
            columns:
              - title:
                  '$i18n{organization.tenant-list.tenant-name-2:租户名称}'
                cell:
                  type: Button
                  props:
                    text: ${row.tenantName}
                    variant: link
                    size: small
                  events:
                    onClick:
                      - action: navigate
                        params:
                          to: /ops/organization/tenants/${row.tenantId}
              - title:
                  '$i18n{organization.tenant-list.code:编码}'
                dataIndex: tenantCode
              - title:
                  '$i18n{organization.tenant-list.type-2:类型}'
                cell:
                  type: Text
                  props:
                    text: "${row.tenantType == 'ENTERPRISE' ? t('organization.tenant-list.type.enterprise') : row.tenantType == 'TEAM' ?
                      t('organization.tenant-list.type.team') : row.tenantType == 'INDIVIDUAL' ?
                      t('organization.tenant-list.type.individual') : row.tenantType}"
              - title:
                  '$i18n{organization.tenant-list.status-2:状态}'
                cell:
                  type: Text
                  props:
                    text: "${row.status == 'ACTIVE' ? t('organization.tenant-list.status.active') : row.status == 'SUSPENDED' ?
                      t('organization.tenant-list.status.suspended') : row.status == 'ARCHIVED' ?
                      t('organization.tenant-list.status.archived') : row.status}"
              - title:
                  '$i18n{organization.tenant-list.plan:套餐}'
                dataIndex: planCode
              - title:
                  '$i18n{organization.tenant-list.legal-name:法定名称}'
                dataIndex: legalName
              - title:
                  '$i18n{organization.tenant-list.actions:操作}'
                cell:
                  type: Button
                  props:
                    text: '$i18n{organization.tenant-list.details:详情}'
                    variant: link
                    size: small
                  events:
                    onClick:
                      - action: navigate
                        params:
                          to: /ops/organization/tenants/${row.tenantId}
        - type: Text
          props:
            text: "${t('organization.tenant-list.summary.count', { count: data.tenants.total })}"
            type: secondary
            className: mt-3
