dsl: "1.0"
page:
  id: tenant-detail
  title: '$i18n{organization.tenant-detail.title:租户详情}'
  name: tenantDetail

state:
  editingTenant: false
  editingEnterprise: false

dataSources:
  tenant:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/platform/tenants/${params.tenantId}
  admins:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/platform/tenants/${params.tenantId}/admins
  enterprise:
    type: http
    autoLoad: false
    request:
      method: GET
      url: /api/d/platform/tenants/${params.tenantId}/enterprise
i18n:
  namespaces:
    - organization
lifecycle:
  onShow:
    - action: reload
      params:
        dataSource: tenant
    - action: reload
      params:
        dataSource: admins
    - action: form.setValues
      params:
        form: tenantEditForm
        values: ${data.tenant}
    - action: if
      params:
        condition: ${data.tenant != null && data.tenant.tenantType == 'ENTERPRISE'}
        then:
          - action: reload
            params:
              dataSource: enterprise
          - action: form.setValues
            params:
              form: enterpriseEditForm
              values: ${data.enterprise}
body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label:
              '$i18n{organization.tenant-detail.operations:运营管理}'
            href: /ops/organization/tenants
          - label:
              '$i18n{organization.tenant-detail.tenant-management:租户管理}'
            href: /ops/organization/tenants
          - label: "${data.tenant != null && data.tenant.tenantName != null ? data.tenant.tenantName : params.tenantId}"
    - type: Button
      props:
        text: '$i18n{organization.tenant-detail.back-to-tenants:← 返回租户列表}'
        variant: link
      events:
        onClick:
          - action: navigate
            params:
              to: /ops/organization/tenants
    - type: Flex
      when: ${data.tenant != null}
      props:
        justify: space-between
        align: start
        className: mt-2
      children:
        - type: Typography
          props:
            variant: h3
            text: ${data.tenant.tenantName}
        - type: Flex
          props:
            gap: small
          children:
            - type: Button
              when: ${data.tenant.status == 'ACTIVE'}
              props:
                text: '$i18n{organization.tenant-detail.suspend:暂停}'
              events:
                onClick:
                  - action: confirm
                    params:
                      title: '$i18n{organization.tenant-detail.suspend-tenant:暂停租户}'
                      content: '$i18n{organization.tenant-detail.suspending-blocks-tenant-access-continue:暂停后租户访问将被阻断，确定继续吗？}'
                  - action: request
                    params:
                      method: PUT
                      url: /api/d/platform/tenants/${params.tenantId}/status
                      body:
                        status: SUSPENDED
                  - action: message
                    params:
                      messageType: success
                      text: '$i18n{organization.tenant-detail.tenant-suspended:租户已暂停}'
                  - action: reload
                    params:
                      dataSource: tenant
            - type: Button
              when: ${data.tenant.status == 'SUSPENDED'}
              props:
                text: '$i18n{organization.tenant-detail.restore:恢复}'
                variant: primary
              events:
                onClick:
                  - action: confirm
                    params:
                      title: '$i18n{organization.tenant-detail.restore-tenant:恢复租户}'
                      content: '$i18n{organization.tenant-detail.restore-normal-operation:确定恢复为正常运营状态吗？}'
                  - action: request
                    params:
                      method: PUT
                      url: /api/d/platform/tenants/${params.tenantId}/status
                      body:
                        status: ACTIVE
                  - action: message
                    params:
                      messageType: success
                      text: '$i18n{organization.tenant-detail.tenant-restored:租户已恢复}'
                  - action: reload
                    params:
                      dataSource: tenant
            - type: Button
              when: ${data.tenant.status == 'ARCHIVED'}
              props:
                text: '$i18n{organization.tenant-detail.restore-2:恢复}'
                variant: primary
              events:
                onClick:
                  - action: confirm
                    params:
                      title: '$i18n{organization.tenant-detail.restore-tenant-2:恢复租户}'
                      content: '$i18n{organization.tenant-detail.restore-the-archived-tenant-to-normal-operation:确定将归档租户恢复为正常运营状态吗？}'
                  - action: request
                    params:
                      method: PUT
                      url: /api/d/platform/tenants/${data.tenant.tenantId}/status
                      body:
                        status: ACTIVE
                  - action: message
                    params:
                      messageType: success
                      text: '$i18n{organization.tenant-detail.tenant-restored-to-active:租户已恢复为正常}'
                  - action: reload
                    params:
                      dataSource: tenant
            - type: Button
              when: ${data.tenant.status != 'ARCHIVED'}
              props:
                text: '$i18n{organization.tenant-detail.archive:归档}'
                danger: true
              events:
                onClick:
                  - action: confirm
                    params:
                      title: '$i18n{organization.tenant-detail.archive-tenant:归档租户}'
                      content: '$i18n{organization.tenant-detail.archiving-makes-the-tenant-inactive-continue:归档后租户不再活跃，确定继续吗？}'
                  - action: request
                    params:
                      method: PUT
                      url: /api/d/platform/tenants/${params.tenantId}/status
                      body:
                        status: ARCHIVED
                  - action: message
                    params:
                      messageType: success
                      text: '$i18n{organization.tenant-detail.tenant-archived:租户已归档}'
                  - action: reload
                    params:
                      dataSource: tenant
            - type: Button
              props:
                text: "${state.editingTenant ? t('organization.tenant-detail.cancel-editing') :
                  t('organization.tenant-detail.edit-tenant')}"
              events:
                onClick:
                  - action: if
                    params:
                      condition: ${state.editingTenant}
                      then:
                        - action: setState
                          params:
                            editingTenant: false
                        - action: form.setValues
                          params:
                            form: tenantEditForm
                            values: ${data.tenant}
                      else:
                        - action: setState
                          params:
                            editingTenant: true
    - type: Card
      when: ${data.tenant != null}
      props:
        className: mt-4
      children:
        - type: Text
          props:
            text: '$i18n{organization.tenant-detail.tenant-information:租户信息}'
            strong: true
        - type: Descriptions
          when: ${!state.editingTenant}
          props:
            className: mt-3
            items:
              - label:
                  '$i18n{organization.tenant-detail.tenant-id:租户 ID}'
                value: ${data.tenant.tenantId}
              - label:
                  '$i18n{organization.tenant-detail.tenant-code:租户编码}'
                value: ${data.tenant.tenantCode}
              - label:
                  '$i18n{organization.tenant-detail.display-name:显示名称}'
                value: ${data.tenant.tenantName}
              - label:
                  '$i18n{organization.tenant-detail.tenant-type:租户类型}'
                value: "${data.tenant.tenantType == 'ENTERPRISE' ? t('organization.tenant-detail.type.enterprise') :
                  data.tenant.tenantType == 'TEAM' ? t('organization.tenant-detail.type.team') : data.tenant.tenantType
                  == 'INDIVIDUAL' ? t('organization.tenant-detail.type.individual') : data.tenant.tenantType}"
              - label:
                  '$i18n{organization.tenant-detail.status:状态}'
                value: "${data.tenant.status == 'ACTIVE' ? t('organization.tenant-detail.status.active') : data.tenant.status ==
                  'SUSPENDED' ? t('organization.tenant-detail.status.suspended') : data.tenant.status == 'ARCHIVED' ?
                  t('organization.tenant-detail.status.archived') : data.tenant.status}"
        - type: Form
          when: ${state.editingTenant}
          props:
            name: tenantEditForm
            layout: vertical
            className: mt-3
            initialValues: ${data.tenant}
          events:
            onSubmit:
              - action: request
                params:
                  method: PUT
                  url: /api/d/platform/tenants/${params.tenantId}
                  body:
                    tenantName: ${event.tenantName}
              - action: message
                params:
                  messageType: success
                  text: '$i18n{organization.tenant-detail.tenant-profile-saved:租户资料已保存}'
              - action: setState
                params:
                  editingTenant: false
              - action: reload
                params:
                  dataSource: tenant
          children:
            - type: Field
              props:
                label: '$i18n{organization.tenant-detail.display-name-2:显示名称}'
                required: true
              children:
                - type: Input
                  props:
                    name: tenantName
                    rules:
                      - required: true
                        message: '$i18n{organization.tenant-detail.enter-a-display-name:请输入显示名称}'
            - type: Flex
              props:
                justify: end
                gap: small
              children:
                - type: Button
                  props:
                    text: '$i18n{organization.tenant-detail.save-changes:保存修改}'
                    variant: primary
                    submit: true
                    htmlType: submit
    - type: Card
      when: ${data.tenant != null}
      props:
        className: mt-4
      children:
        - type: Flex
          props:
            justify: space-between
            align: center
          children:
            - type: Text
              props:
                text: '$i18n{organization.tenant-detail.tenant-administrator:租户管理员}'
                strong: true
            - type: Button
              props:
                text: '$i18n{organization.tenant-detail.add-administrator:+ 添加管理员}'
                variant: primary
                size: small
              events:
                onClick:
                  - action: overlay.open
                    params:
                      overlay:
                        type: modal
                        title: '$i18n{organization.tenant-detail.add-tenant-administrator:添加租户管理员}'
                        width: 480
                        content:
                          type: Form
                          props:
                            name: tenantAdminAddForm
                            layout: vertical
                          events:
                            onSubmit:
                              - action: request
                                params:
                                  method: POST
                                  url: /api/d/platform/tenants/${data.tenant.tenantId}/admins
                                  body:
                                    email: ${event.email}
                                    adminRole: ${event.adminRole}
                              - action: message
                                params:
                                  messageType: success
                                  text: '$i18n{organization.tenant-detail.added:已添加}'
                              - action: overlay.close
                              - action: reload
                                params:
                                  dataSource: admins
                          children:
                            - type: Field
                              props:
                                label: '$i18n{organization.tenant-detail.role:角色}'
                                required: true
                              children:
                                - type: Select
                                  props:
                                    name: adminRole
                                    placeholder: '$i18n{organization.tenant-detail.select:请选择}'
                                    options:
                                      - label:
                                          '$i18n{organization.tenant-detail.owner:所有者}'
                                        value: OWNER
                                      - label:
                                          '$i18n{organization.tenant-detail.administrator:管理员}'
                                        value: ADMINISTRATOR
                                    rules:
                                      - required: true
                                        message: '$i18n{organization.tenant-detail.select-a-role:请选择角色}'
                            - type: Field
                              props:
                                label: '$i18n{organization.tenant-detail.email:邮箱}'
                                required: true
                              children:
                                - type: Input
                                  props:
                                    name: email
                                    placeholder: admin@example.com
                                    rules:
                                      - required: true
                                        message: '$i18n{organization.tenant-detail.enter-an-email-address:请输入邮箱}'
                            - type: Flex
                              props:
                                justify: end
                                gap: small
                                className: mt-4
                              children:
                                - type: Button
                                  props:
                                    text: '$i18n{organization.tenant-detail.cancel:取消}'
                                  events:
                                    onClick:
                                      - action: overlay.close
                                - type: Button
                                  props:
                                    text: '$i18n{organization.tenant-detail.confirm:确认}'
                                    variant: primary
                                    submit: true
                                    htmlType: submit
        - type: Table
          props:
            className: mt-3
            rowKey: tenantAdminId
            pagination: false
            dataSource: ${data.admins}
            columns:
              - title:
                  '$i18n{organization.tenant-detail.role-2:角色}'
                cell:
                  type: Text
                  props:
                    text: "${row.adminRole == 'OWNER' ? t('organization.tenant-detail.role.owner') : row.adminRole == 'ADMINISTRATOR' ?
                      t('organization.tenant-detail.role.administrator') : row.adminRole}"
              - title:
                  '$i18n{organization.tenant-detail.username:用户名}'
                cell:
                  type: Text
                  props:
                    text: "${row.displayName != null && row.displayName != '' ? row.displayName : '—'}"
              - title:
                  '$i18n{organization.tenant-detail.user-email:用户邮箱}'
                cell:
                  type: Text
                  props:
                    text: "${row.email != null && row.email != '' ? row.email : '—'}"
              - title:
                  '$i18n{organization.tenant-detail.actions:操作}'
                cell:
                  type: Button
                  when: ${row.email != null && row.email != ''}
                  props:
                    text: '$i18n{organization.tenant-detail.delete:删除}'
                    variant: link
                    size: small
                    danger: true
                  events:
                    onClick:
                      - action: confirm
                        params:
                          title: '$i18n{organization.tenant-detail.remove-administrator:删除管理员}'
                          content: '$i18n{organization.tenant-detail.remove-this-administrator-from-the-tenant-the-tenant-user-account-will-n:确定从该租户移除该管理员吗？不会删除租户用户账号。}'
                      - action: request
                        params:
                          method: DELETE
                          url: /api/d/platform/tenants/${data.tenant.tenantId}/admins/${row.tenantAdminId}
                      - action: message
                        params:
                          messageType: success
                          text: '$i18n{organization.tenant-detail.deleted:已删除}'
                      - action: reload
                        params:
                          dataSource: admins
    - type: Card
      when: ${data.tenant != null && data.tenant.tenantType == 'ENTERPRISE'}
      props:
        className: mt-4
      children:
        - type: Flex
          props:
            justify: space-between
            align: center
          children:
            - type: Text
              props:
                text: '$i18n{organization.tenant-detail.enterprise-profile:企业档案}'
                strong: true
            - type: Button
              props:
                text: "${state.editingEnterprise ? t('common.ui.cancel') : t('organization.tenant-detail.edit-profile')}"
                variant: link
                size: small
              events:
                onClick:
                  - action: if
                    params:
                      condition: ${state.editingEnterprise}
                      then:
                        - action: setState
                          params:
                            editingEnterprise: false
                        - action: form.setValues
                          params:
                            form: enterpriseEditForm
                            values: ${data.enterprise}
                      else:
                        - action: setState
                          params:
                            editingEnterprise: true
        - type: Descriptions
          when: ${!state.editingEnterprise && data.enterprise != null && data.enterprise.enterpriseId != null}
          props:
            className: mt-3
            items:
              - label:
                  '$i18n{organization.tenant-detail.enterprise-id:企业 ID}'
                value: ${data.enterprise.enterpriseId}
              - label:
                  '$i18n{organization.tenant-detail.legal-name:法定名称}'
                value: ${data.enterprise.legalName}
              - label:
                  '$i18n{organization.tenant-detail.credit-code:信用代码}'
                value: "${data.enterprise.creditCode != null ? data.enterprise.creditCode : '—'}"
              - label:
                  '$i18n{organization.tenant-detail.industry:行业}'
                value: "${data.enterprise.industry != null ? data.enterprise.industry : '—'}"
              - label:
                  '$i18n{organization.tenant-detail.contact:联系人}'
                value: "${(data.enterprise.contactName != null ? data.enterprise.contactName : '') + (data.enterprise.contactPhone !=
                  null ? ' · ' + data.enterprise.contactPhone : '') + (data.enterprise.contactEmail != null ? ' · ' +
                  data.enterprise.contactEmail : '')}"
              - label:
                  '$i18n{organization.tenant-detail.address:地址}'
                value: "${data.enterprise.address != null ? data.enterprise.address : '—'}"
        - type: Form
          when: ${state.editingEnterprise}
          props:
            name: enterpriseEditForm
            layout: vertical
            className: mt-3
            initialValues: ${data.enterprise}
          events:
            onSubmit:
              - action: request
                params:
                  method: PUT
                  url: /api/d/platform/tenants/${params.tenantId}/enterprise
                  body:
                    legalName: ${event.legalName}
                    creditCode: ${event.creditCode}
                    industry: ${event.industry}
                    contactName: ${event.contactName}
                    contactPhone: ${event.contactPhone}
                    contactEmail: ${event.contactEmail}
                    address: ${event.address}
                    extra: ${event.extra}
              - action: message
                params:
                  messageType: success
                  text: '$i18n{organization.tenant-detail.enterprise-profile-saved:企业档案已保存}'
              - action: setState
                params:
                  editingEnterprise: false
              - action: reload
                params:
                  dataSource: enterprise
              - action: reload
                params:
                  dataSource: tenant
          children:
            - type: Field
              props:
                label: '$i18n{organization.tenant-detail.legal-name-2:法定名称}'
                required: true
              children:
                - type: Input
                  props:
                    name: legalName
                    rules:
                      - required: true
                        message: '$i18n{organization.tenant-detail.enter-the-legal-name:请输入法定名称}'
            - type: Grid
              props:
                columns: 2
                gap: 16
              children:
                - type: Field
                  props:
                    label: '$i18n{organization.tenant-detail.credit-code-2:信用代码}'
                  children:
                    - type: Input
                      props:
                        name: creditCode
                - type: Field
                  props:
                    label: '$i18n{organization.tenant-detail.industry-2:行业}'
                  children:
                    - type: Input
                      props:
                        name: industry
                - type: Field
                  props:
                    label: '$i18n{organization.tenant-detail.contact-2:联系人}'
                  children:
                    - type: Input
                      props:
                        name: contactName
                - type: Field
                  props:
                    label: '$i18n{organization.tenant-detail.phone:电话}'
                  children:
                    - type: Input
                      props:
                        name: contactPhone
                - type: Field
                  props:
                    label: '$i18n{organization.tenant-detail.email-2:邮箱}'
                  children:
                    - type: Input
                      props:
                        name: contactEmail
            - type: Field
              props:
                label: '$i18n{organization.tenant-detail.address-2:地址}'
              children:
                - type: Textarea
                  props:
                    name: address
            - type: Flex
              props:
                justify: end
                gap: small
              children:
                - type: Button
                  props:
                    text: '$i18n{organization.tenant-detail.save-profile:保存档案}'
                    variant: primary
                    submit: true
                    htmlType: submit
