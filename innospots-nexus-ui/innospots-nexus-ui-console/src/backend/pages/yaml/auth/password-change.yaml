dsl: "1.0"
page:
  access-mode: authenticated
  id: password-change
  title: '$i18n{auth.password-change.title:修改密码}'
  name: passwordChange
i18n:
  namespaces:
    - auth
body:
  type: Page
  props:
    className: password-change-page
  children:
    - type: Breadcrumb
      props:
        items:
          - label:
              '$i18n{auth.password-change.profile:个人中心}'
          - label:
              '$i18n{auth.password-change.security-settings:安全设置}'
          - label:
              '$i18n{auth.password-change.change-password:修改密码}'
    - type: PlatformPasswordChangeForm
      access:
        requests:
          - method: POST
            url: /api/d/platform/auth/password/change
