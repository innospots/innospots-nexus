dsl: "1.0"
page:
  id: tenant-create
  title: 开通租户
  name: tenantCreate

body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 运营管理
            href: /ops/organization/tenants
          - label: 租户管理
            href: /ops/organization/tenants
          - label: 开通租户
    - type: Button
      props:
        text: ← 返回租户列表
        variant: link
      events:
        onClick:
          - action: navigate
            params: { to: /ops/organization/tenants }
    - type: Typography
      props:
        variant: h3
        text: 开通租户
        className: mt-2
    - type: Typography
      props:
        variant: muted
        text: 先创建租户记录，再写入企业法定档案（对应 TenantEndpoint 与 EnterpriseProfileEndpoint）。
        className: mb-4
    - type: Card
      children:
        - type: Form
          props:
            name: tenantCreateForm
            layout: vertical
          events:
            onSubmit:
              - id: tenantCreated
                action: request
                params:
                  method: POST
                  url: /api/d/platform/tenants
                  body:
                    tenantName: ${event.tenantName}
                    tenantCode: ${event.tenantCode}
                    tenantType: ${event.tenantType}
                    planCode: ${event.planCode}
                    ownerTenantUserId: ${event.ownerTenantUserId}
              - action: request
                params:
                  method: PUT
                  url: /api/d/platform/tenants/${actions.tenantCreated.tenantId}/enterprise
                  body:
                    legalName: ${event.legalName}
                    creditCode: ${event.creditCode}
                    industry: ${event.industry}
                    contactName: ${event.contactName}
                    contactPhone: ${event.contactPhone}
                    contactEmail: ${event.contactEmail}
                    address: ${event.address}
              - action: message
                params:
                  messageType: success
                  text: 租户已开通
              - action: navigate
                params:
                  to: /ops/organization/tenants/${actions.tenantCreated.tenantId}
          children:
            - type: Text
              props:
                text: 租户信息
                strong: true
            - type: Separator
            - type: Grid
              props:
                columns: 2
                gap: 16
              children:
                - type: Field
                  props:
                    label: 显示名称
                    required: true
                  children:
                    - type: Input
                      props:
                        name: tenantName
                        rules:
                          - required: true
                            message: 请输入显示名称
                - type: Field
                  props:
                    label: 租户编码
                    required: true
                    labelHint: 创建后不可修改
                  children:
                    - type: Input
                      props:
                        name: tenantCode
                        placeholder: 小写英文、数字、连字符
                        rules:
                          - required: true
                            message: 请输入租户编码
                - type: Field
                  props:
                    label: 租户类型
                    required: true
                  children:
                    - type: Select
                      props:
                        name: tenantType
                        placeholder: 请选择
                        options:
                          - { label: 企业客户, value: ENTERPRISE }
                          - { label: 团队, value: TEAM }
                          - { label: 个人, value: INDIVIDUAL }
                        rules:
                          - required: true
                            message: 请选择租户类型
                - type: Field
                  props:
                    label: 套餐
                  children:
                    - type: Input
                      props:
                        name: planCode
                        placeholder: planCode（可选）
                - type: Field
                  props:
                    label: 初始 Owner
                    labelHint: 可选，租户用户 ID
                  children:
                    - type: Input
                      props:
                        name: ownerTenantUserId
                        placeholder: ownerTenantUserId
            - type: Text
              props:
                text: 企业档案
                strong: true
                className: mt-4
            - type: Separator
            - type: Grid
              props:
                columns: 2
                gap: 16
              children:
                - type: Field
                  props:
                    label: 法定名称
                    required: true
                  children:
                    - type: Input
                      props:
                        name: legalName
                        rules:
                          - required: true
                            message: 请输入法定名称
                - type: Field
                  props:
                    label: 信用代码
                  children:
                    - type: Input
                      props:
                        name: creditCode
                - type: Field
                  props:
                    label: 行业
                  children:
                    - type: Input
                      props:
                        name: industry
                - type: Field
                  props:
                    label: 联系人
                  children:
                    - type: Input
                      props:
                        name: contactName
                - type: Field
                  props:
                    label: 电话
                  children:
                    - type: Input
                      props:
                        name: contactPhone
                - type: Field
                  props:
                    label: 邮箱
                  children:
                    - type: Input
                      props:
                        name: contactEmail
            - type: Field
              props:
                label: 注册地址
              children:
                - type: Textarea
                  props:
                    name: address
            - type: Flex
              props:
                justify: end
                gap: small
                className: mt-4
              children:
                - type: Button
                  props:
                    text: 取消
                  events:
                    onClick:
                      - action: navigate
                        params: { to: /ops/organization/tenants }
                - type: Button
                  props:
                    text: 确认开通
                    variant: primary
                    submit: true
                    htmlType: submit
