dsl: "1.0"
page:
  id: dashboard
  title: 工作台
  name: dashboard

body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 工作台
    - type: Flex
      props:
        direction: vertical
        gap: middle
      children:
        - type: Typography
          props:
            variant: h3
            text: 欢迎使用 Nexus Console
        - type: Typography
          props:
            variant: muted
            text: 请从左侧「系统管理」进入菜单、角色、字典、审计日志或插件管理。
        - type: Flex
          props:
            gap: small
          children:
            - type: Button
              props:
                text: 角色管理
                variant: primary
              events:
                onClick:
                  - action: navigate
                    params: { to: /system/roles }
            - type: Button
              props:
                text: 插件管理
              events:
                onClick:
                  - action: navigate
                    params: { to: /system/plugins }
