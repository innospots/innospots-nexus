dsl: "1.0"
page:
  id: plugin-list
  title: '$i18n{plugin.plugin-list.title:插件管理}'
  name: pluginList

state:
  installed: ""
  keyword: ""

dataSources:
  plugins:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/nexus/plugins
      params:
        keyword: ${state.keyword}
        installed: ${state.installed}
i18n:
  namespaces:
    - plugin
body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label:
              '$i18n{plugin.plugin-list.system-management:系统管理}'
          - label:
              '$i18n{plugin.plugin-list.plugin-management:插件管理}'
    - type: Flex
      props:
        justify: space-between
        align: center
      children:
        - type: Flex
          props:
            direction: vertical
            gap: 2
          children:
            - type: Typography
              props:
                variant: h3
                text: '$i18n{plugin.plugin-list.plugin-management-2:插件管理}'
            - type: Typography
              props:
                variant: muted
                text: '$i18n{plugin.plugin-list.manage-plugin-installation-state-and-runtime-lifecycle:管理插件安装状态与运行生命周期。}'
        - type: Button
          props:
            text: '$i18n{plugin.plugin-list.refresh-status:刷新状态}'
          events:
            onClick:
              - action: reload
                params:
                  dataSource: plugins
    - type: Card
      children:
        - type: Form
          props:
            name: pluginSearch
            layout: inline
            initialValues:
              keyword: ${state.keyword}
              installed: "${state.installed == '' ? '__ALL__' : state.installed}"
          events:
            onSubmit:
              - action: setState
                params:
                  keyword: ${event.keyword}
                  installed: "${event.installed == '__ALL__' ? '' : event.installed}"
              - action: reload
                params:
                  dataSource: plugins
          children:
            - type: Field
              props:
                label: '$i18n{plugin.plugin-list.plugin-name:插件名称}'
              children:
                - type: Input
                  props:
                    name: keyword
                    placeholder: '$i18n{plugin.plugin-list.search-plugin-name-or-identifier:搜索插件名称或标识}'
            - type: Field
              props:
                label: '$i18n{plugin.plugin-list.installation-status:安装状态}'
              children:
                - type: FilterSelect
                  props:
                    name: installed
                    placeholder: '$i18n{plugin.plugin-list.all-2:全部}'
                    options:
                      - label:
                          '$i18n{plugin.plugin-list.all:全部}'
                        value: ""
                      - label:
                          '$i18n{plugin.plugin-list.installed:已安装}'
                        value: installed
                      - label:
                          '$i18n{plugin.plugin-list.not-installed:未安装}'
                        value: notInstalled
            - type: Field
              props:
                label:  
              children:
                - type: Flex
                  props:
                    gap: small
                    align: center
                  children:
                    - type: Button
                      props:
                        text: '$i18n{plugin.plugin-list.search:查询}'
                        submit: true
                        htmlType: submit
                    - type: Button
                      props:
                        text: '$i18n{plugin.plugin-list.reset:重置}'
                      events:
                        onClick:
                          - action: form.setValues
                            params:
                              form: pluginSearch
                              values:
                                keyword: ""
                                installed: __ALL__
                          - action: setState
                            params:
                              keyword: ""
                              installed: ""
                          - action: reload
                            params:
                              dataSource: plugins
        - type: Table
          props:
            rowKey: pluginId
            dataSource: ${data.plugins}
            loading: ${dataStatus.plugins.loading}
            className: mt-4
            columns:
              - title:
                  '$i18n{plugin.plugin-list.plugin:插件}'
                cell:
                  type: Button
                  props:
                    text: ${row.pluginName}
                    variant: link
                    size: small
                  events:
                    onClick:
                      - action: navigate
                        params:
                          to: /system/plugins/${row.pluginId}
              - title:
                  '$i18n{plugin.plugin-list.version:版本}'
                dataIndex: version
              - title:
                  '$i18n{plugin.plugin-list.installed-2:已安装}'
                cell:
                  type: Text
                  props:
                    text: "${row.installed ? t('plugin.plugin-list.installed') : t('plugin.plugin-list.not-installed')}"
              - title:
                  '$i18n{plugin.plugin-list.runtime-status:运行状态}'
                dataIndex: runtimeState
              - title:
                  '$i18n{plugin.plugin-list.actions:操作}'
                cell:
                  type: Flex
                  props:
                    gap: small
                  children:
                    - type: Button
                      when: ${!row.installed}
                      props:
                        text: '$i18n{plugin.plugin-list.install:安装}'
                        variant: link
                        size: small
                      events:
                        onClick:
                          - action: confirm
                            params:
                              title: '$i18n{plugin.plugin-list.install-plugin:安装插件}'
                              content: '$i18n{plugin.plugin-list.this-plugin-may-contribute-pages-and-navigation-after-installation-insta:安装后可能贡献新的页面与导航，确定安装吗？}'
                          - action: request
                            params:
                              method: POST
                              url: /api/d/nexus/plugins/${row.pluginId}/install
                          - action: message
                            params:
                              messageType: success
                              text: '$i18n{plugin.plugin-list.installation-request-submitted:安装请求已提交}'
                          - action: reload
                            params:
                              dataSource: plugins
                    - type: Button
                      when: ${row.installed && row.desiredEnabled}
                      props:
                        text: '$i18n{plugin.plugin-list.disable:停用}'
                        variant: link
                        size: small
                      events:
                        onClick:
                          - action: confirm
                            params:
                              title: '$i18n{plugin.plugin-list.disable-plugin:停用插件}'
                              content: '$i18n{plugin.plugin-list.related-capabilities-become-unavailable-continue:停用后相关能力将不可用，确定吗？}'
                          - action: request
                            params:
                              method: POST
                              url: /api/d/nexus/plugins/${row.pluginId}/disable
                          - action: reload
                            params:
                              dataSource: plugins
                    - type: Button
                      when: ${row.installed && !row.desiredEnabled}
                      props:
                        text: '$i18n{plugin.plugin-list.enable:启用}'
                        variant: link
                        size: small
                      events:
                        onClick:
                          - action: confirm
                            params:
                              title: '$i18n{plugin.plugin-list.enable-plugin:启用插件}'
                              content: '$i18n{plugin.plugin-list.enable-this-plugin:确定启用该插件吗？}'
                          - action: request
                            params:
                              method: POST
                              url: /api/d/nexus/plugins/${row.pluginId}/enable
                          - action: reload
                            params:
                              dataSource: plugins
                    - type: Button
                      when: ${row.lastError != null && row.lastError != ''}
                      props:
                        text: '$i18n{plugin.plugin-list.retry:重试}'
                        variant: link
                        size: small
                      events:
                        onClick:
                          - action: confirm
                            params:
                              title: '$i18n{plugin.plugin-list.retry-start:重试启动}'
                              content: '$i18n{plugin.plugin-list.retry-starting-this-plugin:将重新尝试启动该插件，确定吗？}'
                          - action: request
                            params:
                              method: POST
                              url: /api/d/nexus/plugins/${row.pluginId}/retry
                          - action: reload
                            params:
                              dataSource: plugins
        - type: Text
          props:
            text: "${t('plugin.plugin-list.summary.count', { count: data.plugins.length })}"
            type: secondary
            className: mt-3
