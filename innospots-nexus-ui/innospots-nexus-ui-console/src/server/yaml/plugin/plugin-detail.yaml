dsl: "1.0"
page:
  id: plugin-detail
  title: 插件详情
  name: pluginDetail

dataSources:
  pluginInfo:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/nexus/plugins/${route.params.pluginId}

lifecycle:
  onShow:
    - action: reload
      params:
        dataSource: pluginInfo

body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 插件管理
            href: /system/plugins
          - label: "${data.pluginInfo != null && data.pluginInfo.pluginName != null ? data.pluginInfo.pluginName : route.params.pluginId}"
    - type: Button
      props:
        text: ← 返回插件列表
        variant: link
      events:
        onClick:
          - action: navigate
            params: { to: /system/plugins }
    - type: Card
      when: ${data.pluginInfo != null}
      props:
        className: mt-2
      children:
        - type: Flex
          props:
            justify: space-between
            align: start
          children:
            - type: Flex
              props:
                direction: vertical
                gap: small
              children:
                - type: Typography
                  props:
                    variant: h3
                    text: "${data.pluginInfo.pluginName != null ? data.pluginInfo.pluginName : data.pluginInfo.pluginId}"
                - type: Typography
                  props:
                    variant: muted
                    text: ${route.params.pluginId}
                - type: Typography
                  props:
                    variant: muted
                    text: 版本 ${data.pluginInfo.version}
                - type: Flex
                  props:
                    gap: small
                  children:
                    - type: Badge
                      props:
                        text: "${data.pluginInfo.installed ? '已安装' : '未安装'}"
                    - type: Badge
                      when: ${data.pluginInfo.installed}
                      props:
                        text: ${data.pluginInfo.runtimeState}
            - type: Flex
              props:
                gap: small
              children:
                - type: Button
                  when: ${!data.pluginInfo.installed}
                  props:
                    text: 安装
                    variant: primary
                  events:
                    onClick:
                      - action: confirm
                        params:
                          title: 安装插件
                          content: 确定安装吗？
                      - action: request
                        params:
                          method: POST
                          url: /api/d/nexus/plugins/${route.params.pluginId}/install
                      - action: reload
                        params:
                          dataSource: pluginInfo
                - type: Button
                  when: ${data.pluginInfo.installed && data.pluginInfo.desiredEnabled}
                  props:
                    text: 停用
                    variant: primary
                  events:
                    onClick:
                      - action: confirm
                        params:
                          title: 停用插件
                          content: 确定停用吗？
                      - action: request
                        params:
                          method: POST
                          url: /api/d/nexus/plugins/${route.params.pluginId}/disable
                      - action: reload
                        params:
                          dataSource: pluginInfo
                - type: Button
                  when: ${data.pluginInfo.installed && !data.pluginInfo.desiredEnabled}
                  props:
                    text: 启用
                    variant: primary
                  events:
                    onClick:
                      - action: request
                        params:
                          method: POST
                          url: /api/d/nexus/plugins/${route.params.pluginId}/enable
                      - action: reload
                        params:
                          dataSource: pluginInfo
                - type: Button
                  when: ${data.pluginInfo.lastError != null && data.pluginInfo.lastError != ''}
                  props:
                    text: 重试
                  events:
                    onClick:
                      - action: request
                        params:
                          method: POST
                          url: /api/d/nexus/plugins/${route.params.pluginId}/retry
                      - action: reload
                        params:
                          dataSource: pluginInfo
    - type: Card
      when: ${data.pluginInfo != null}
      props:
        className: mt-4
      children:
        - type: Text
          props:
            text: 基本信息
            strong: true
        - type: Descriptions
          props:
            className: mt-2
            bordered: true
            column: 2
            items:
              - { label: 插件 ID, value: "${data.pluginInfo.pluginId}" }
              - { label: 展示名称, value: "${data.pluginInfo.pluginName != null ? data.pluginInfo.pluginName : '—'}" }
              - { label: 版本号, value: "${data.pluginInfo.version}" }
              - { label: 来源类型, value: "${data.pluginInfo.sourceType != null ? data.pluginInfo.sourceType : '—'}" }
              - { label: 来源位置, value: "${data.pluginInfo.sourceLocation != null ? data.pluginInfo.sourceLocation : '—'}" }
              - { label: 运行状态, value: "${data.pluginInfo.runtimeState != null ? data.pluginInfo.runtimeState : '—'}" }
              - { label: 安装日期, value: "${data.pluginInfo.installedAt != null ? data.pluginInfo.installedAt : '—'}" }
              - { label: 最近发现, value: "${data.pluginInfo.lastDiscoveredAt != null ? data.pluginInfo.lastDiscoveredAt : '—'}" }
    - type: Card
      when: ${data.pluginInfo != null && data.pluginInfo.lastError != null && data.pluginInfo.lastError != ''}
      props:
        className: mt-4
      children:
        - type: Alert
          props:
            variant: error
            message: ${data.pluginInfo.lastError}
    - type: Alert
      when: ${dataStatus.pluginInfo.error != null}
      props:
        className: mt-4
        variant: error
        message: 加载插件详情失败，请确认插件标识与后端版本是否正确。
