dsl: "1.0"
page:
  id: role-detail-permissions
  title: 角色权限设置
  name: roleDetailPermissions

state:
  resourceSearch: ""
  selectedResourceKey: ""
  draftGrants: null
  dirty: false

dataSources:
  role:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/platform/roles/${params.roleId}
  catalog:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/nexus/catalog/tree
  grants:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/platform/roles/${params.roleId}/permissions

lifecycle:
  onShow:
    - action: reload
      params:
        dataSource: role
    - action: reload
      params:
        dataSource: catalog
    - action: reload
      params:
        dataSource: grants
    - action: setState
      params:
        draftGrants: ${data.grants.grants}
        dirty: false

body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 角色管理
            href: /system/roles
          - label: "${data.role != null && data.role.roleName != null ? data.role.roleName : params.roleId}"
    - type: Button
      props:
        text: ← 返回角色列表
        variant: link
      events:
        onClick:
          - action: navigate
            params: { to: /system/roles }
    - type: Flex
      when: ${data.role != null}
      props:
        justify: space-between
        align: start
        className: mt-2
      children:
        - type: Typography
          props:
            variant: h3
            text: "${data.role.roleCode != null ? data.role.roleCode + ' · ' : ''}${data.role.roleName != null ? data.role.roleName : params.roleId}"
        - type: Flex
          props:
            gap: small
          children:
            - type: Button
              when: ${data.role.status == 'ENABLED' || data.role.status == 'DISABLED'}
              props:
                text: "${data.role.status == 'ENABLED' ? '停用' : '启用'}"
              events:
                onClick:
                  - action: confirm
                    params:
                      title: 确认变更状态
                      content: 确定要变更该角色的启用状态吗？
                  - action: request
                    params:
                      method: PUT
                      url: /api/d/platform/roles/${params.roleId}/status
                      body:
                        status: "${data.role.status == 'ENABLED' ? 'DISABLED' : 'ENABLED'}"
                  - action: message
                    params:
                      messageType: success
                      text: 状态已更新
                  - action: reload
                    params:
                      dataSource: role
            - type: Button
              props:
                text: 修改
                variant: primary
              events:
                onClick:
                  - action: overlay.open
                    params:
                      overlay:
                        type: modal
                        title: 修改角色
                        width: 520
                        content:
                          type: Form
                          props:
                            name: roleEditForm
                            layout: vertical
                            initialValues: ${data.role}
                          events:
                            onSubmit:
                              - action: request
                                params:
                                  method: PUT
                                  url: /api/d/platform/roles/${params.roleId}
                                  body:
                                    roleName: ${event.roleName}
                                    description: ${event.description}
                              - action: message
                                params:
                                  messageType: success
                                  text: 已保存修改
                              - action: overlay.close
                              - action: reload
                                params:
                                  dataSource: role
                          children:
                            - type: Field
                              props:
                                label: 角色名称
                                required: true
                              children:
                                - type: Input
                                  props:
                                    name: roleName
                                    placeholder: 请输入角色名称
                                    rules:
                                      - required: true
                                        message: 请输入角色名称
                            - type: Field
                              props:
                                label: 描述
                              children:
                                - type: Textarea
                                  props:
                                    name: description
                                    placeholder: 角色用途说明
                            - type: Flex
                              props:
                                justify: end
                                gap: small
                                className: mt-4
                              children:
                                - type: Button
                                  props:
                                    text: 取消
                                  events:
                                    onClick:
                                      - action: overlay.close
                                - type: Button
                                  props:
                                    text: 保存
                                    variant: primary
                                    submit: true
                                    htmlType: submit
    - type: Tabs
      props:
        activeKey: permissions
        items:
          - { key: basic, label: 基本信息 }
          - { key: permissions, label: 权限设置 }
          - { key: members, label: 成员列表 }
      events:
        onChange:
          - action: if
            params:
              condition: ${event == 'basic'}
              then:
                - action: navigate
                  params:
                    to: /system/roles/${params.roleId}
          - action: if
            params:
              condition: ${event == 'members'}
              then:
                - action: navigate
                  params:
                    to: /system/roles/${params.roleId}/members
    - type: Flex
      props:
        justify: space-between
        align: center
        className: mt-4
      children:
        - type: Text
          props:
            text: 当前角色已选授权项以保存前草稿为准；保存将全量替换该角色现有授权。
        - type: Input
          props:
            value: ${state.resourceSearch}
            placeholder: 搜索资源名称 / Key
          events:
            onChange:
              - action: setState
                params:
                  resourceSearch: ${event}
    - type: Flex
      props:
        gap: middle
        className: mt-4
        align: stretch
      children:
        - type: Card
          props:
            style: { flex: 1, minWidth: 280 }
          children:
            - type: Flex
              props:
                justify: space-between
                align: center
              children:
                - type: Text
                  props:
                    text: 后台资源目录
                    strong: true
                - type: Button
                  props:
                    text: 同步目录
                    size: small
                  events:
                    onClick:
                      - action: request
                        params:
                          method: POST
                          url: /api/d/nexus/catalog/sync
                      - action: message
                        params:
                          messageType: success
                          text: 目录已同步
                      - action: reload
                        params:
                          dataSource: catalog
            - type: Text
              when: ${dataStatus.catalog.loading}
              props:
                text: 加载目录中…
                type: secondary
                className: mt-2
            - type: CatalogTree
              when: ${!dataStatus.catalog.loading}
              props:
                className: mt-2
                treeData: ${data.catalog}
                search: ${state.resourceSearch}
              events:
                onSelect:
                  - action: setState
                    params:
                      selectedResourceKey: ${event[0]}
        - type: Card
          props:
            style: { flex: 2 }
          children:
            - type: Text
              props:
                text: 当前资源授权
                strong: true
            - type: Text
              when: ${dataStatus.grants.loading}
              props:
                text: 加载授权中…
                type: secondary
                className: mt-2
            - type: PermissionGrantPanel
              when: ${!dataStatus.grants.loading}
              props:
                className: mt-3
                catalog: ${data.catalog}
                selectedResourceKey: ${state.selectedResourceKey}
                grants: ${data.grants.grants}
                draftGrants: ${state.draftGrants}
              events:
                onChange:
                  - action: setState
                    params:
                      draftGrants: ${event.grants}
                      dirty: true
    - type: Flex
      props:
        justify: space-between
        align: center
        className: mt-4
      children:
        - type: Text
          props:
            text: "${state.dirty ? '变更尚未保存' : '无未保存变更'}"
            type: secondary
        - type: Flex
          props:
            gap: small
          children:
            - type: Button
              props:
                text: 取消
              events:
                onClick:
                  - action: reload
                    params:
                      dataSource: grants
                  - action: setState
                    params:
                      draftGrants: ${data.grants.grants}
                      dirty: false
            - type: Button
              props:
                text: 保存完整授权
                variant: primary
                disabled: ${!state.dirty}
              events:
                onClick:
                  - action: confirm
                    params:
                      title: 保存完整授权
                      content: 本次提交会替换该角色现有的全部授权，确定继续吗？
                  - action: request
                    params:
                      method: PUT
                      url: /api/d/platform/roles/${params.roleId}/permissions
                      body:
                        grants: "${state.draftGrants != null ? state.draftGrants : data.grants.grants}"
                  - action: message
                    params:
                      messageType: success
                      text: 授权已保存
                  - action: setState
                    params:
                      dirty: false
                  - action: reload
                    params:
                      dataSource: grants
                  - action: setState
                    params:
                      draftGrants: ${data.grants.grants}
                      dirty: false
