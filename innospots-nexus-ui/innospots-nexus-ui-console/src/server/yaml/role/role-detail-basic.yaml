dsl: "1.0"
page:
  id: role-detail-basic
  title: 角色基本信息
  name: roleDetailBasic

dataSources:
  role:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/platform/roles/${params.roleId}

lifecycle:
  onShow:
    - action: reload
      params:
        dataSource: role

body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 角色管理
            href: /system/roles
          - label: "${data.role != null && data.role.roleName != null ? data.role.roleName : params.roleId}"
    - type: Button
      props:
        text: ← 返回角色列表
        variant: link
      events:
        onClick:
          - action: navigate
            params: { to: /system/roles }
    - type: Flex
      when: ${data.role != null}
      props:
        justify: space-between
        align: start
        className: mt-2
      children:
        - type: Typography
          props:
            variant: h3
            text: "${data.role.roleCode != null ? data.role.roleCode + ' · ' : ''}${data.role.roleName != null ? data.role.roleName : params.roleId}"
        - type: Flex
          props:
            gap: small
          children:
            - type: Button
              when: ${data.role.status == 'ENABLED' || data.role.status == 'DISABLED'}
              props:
                text: "${data.role.status == 'ENABLED' ? '停用' : '启用'}"
              events:
                onClick:
                  - action: confirm
                    params:
                      title: 确认变更状态
                      content: 确定要变更该角色的启用状态吗？
                  - action: request
                    params:
                      method: PUT
                      url: /api/d/platform/roles/${params.roleId}/status
                      body:
                        status: "${data.role.status == 'ENABLED' ? 'DISABLED' : 'ENABLED'}"
                  - action: message
                    params:
                      messageType: success
                      text: 状态已更新
                  - action: reload
                    params:
                      dataSource: role
            - type: Button
              props:
                text: 修改
                variant: primary
              events:
                onClick:
                  - action: overlay.open
                    params:
                      overlay:
                        type: modal
                        title: 修改角色
                        width: 520
                        content:
                          type: Form
                          props:
                            name: roleEditForm
                            layout: vertical
                            initialValues: ${data.role}
                          events:
                            onSubmit:
                              - action: request
                                params:
                                  method: PUT
                                  url: /api/d/platform/roles/${params.roleId}
                                  body:
                                    roleName: ${event.roleName}
                                    description: ${event.description}
                              - action: message
                                params:
                                  messageType: success
                                  text: 已保存修改
                              - action: overlay.close
                              - action: reload
                                params:
                                  dataSource: role
                          children:
                            - type: Field
                              props:
                                label: 角色名称
                                required: true
                              children:
                                - type: Input
                                  props:
                                    name: roleName
                                    placeholder: 请输入角色名称
                                    rules:
                                      - required: true
                                        message: 请输入角色名称
                            - type: Field
                              props:
                                label: 描述
                              children:
                                - type: Textarea
                                  props:
                                    name: description
                                    placeholder: 角色用途说明
                            - type: Flex
                              props:
                                justify: end
                                gap: small
                                className: mt-4
                              children:
                                - type: Button
                                  props:
                                    text: 取消
                                  events:
                                    onClick:
                                      - action: overlay.close
                                - type: Button
                                  props:
                                    text: 保存
                                    variant: primary
                                    submit: true
                                    htmlType: submit
    - type: Tabs
      props:
        activeKey: basic
        items:
          - { key: basic, label: 基本信息 }
          - { key: permissions, label: 权限设置 }
          - { key: members, label: 成员列表 }
      events:
        onChange:
          - action: if
            params:
              condition: ${event == 'permissions'}
              then:
                - action: navigate
                  params:
                    to: /system/roles/${params.roleId}/permissions
          - action: if
            params:
              condition: ${event == 'members'}
              then:
                - action: navigate
                  params:
                    to: /system/roles/${params.roleId}/members
    - type: Card
      when: ${data.role != null}
      props:
        className: mt-4
      children:
        - type: Text
          props:
            text: 基本信息
            strong: true
        - type: Descriptions
          props:
            className: mt-3
            items:
              - { label: 角色名称, value: "${data.role.roleName != null ? data.role.roleName : '—'}" }
              - { label: 角色编码, value: "${data.role.roleCode != null ? data.role.roleCode : '—'}" }
              - label: 归属层级
                value: "${data.role.ownerType != null ? data.role.ownerType : '—'}"
              - label: 状态
                value: "${data.role.status == 'ENABLED' ? '启用' : data.role.status == 'DISABLED' ? '停用' : data.role.status}"
              - { label: 成员数量, value: "${data.role.memberCount != null ? data.role.memberCount : 0}" }
              - label: 描述
                value: "${data.role.description != null && data.role.description != '' ? data.role.description : '—'}"
