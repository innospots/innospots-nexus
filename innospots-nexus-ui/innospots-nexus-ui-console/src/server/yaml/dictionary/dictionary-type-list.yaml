dsl: "1.0"
page:
  id: dictionary-type-list
  title: 数据字典
  name: dictionaryTypeList

state:
  input: ""
  status: ""
  pageNo: 1
  pageSize: 20
  typeDrawerOpen: false
  viewDrawerOpen: false
  drawerMode: create
  editingTypeId: ""
  editingTypeCode: ""

dataSources:
  types:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/platform/dictionary-types
      params:
        input: ${state.input}
        status: ${state.status}
        pageNo: ${state.pageNo}
        pageSize: ${state.pageSize}
  editing:
    type: http
    autoLoad: false
    request:
      method: GET
      url: /api/d/platform/dictionary-types/${state.editingTypeId}
  typeItems:
    type: http
    autoLoad: false
    request:
      method: GET
      url: /api/d/platform/dictionary-types/${state.editingTypeCode}/items
      params:
        pageNo: 1
        pageSize: 200

body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 系统管理
          - label: 数据字典
    - type: Flex
      props:
        justify: space-between
        align: center
      children:
        - type: Flex
          props:
            direction: vertical
            gap: 2
          children:
            - type: Typography
              props:
                variant: h3
                text: 数据字典
            - type: Typography
              props:
                variant: muted
                text: 维护业务可复用的字典类型和对应的值。
        - type: Button
          props:
            text: + 新建类型
            variant: primary
          events:
            onClick: &openCreateDrawer
              - action: setState
                params:
                  viewDrawerOpen: false
                  drawerMode: create
                  editingTypeId: ""
                  editingTypeCode: ""
                  typeDrawerOpen: true
    - type: Card
      children:
        - type: Form
          props:
            name: dictSearch
            layout: inline
            initialValues:
              input: ${state.input}
              status: "${state.status == '' ? '__ALL__' : state.status}"
          events:
            onSubmit:
              - action: setState
                params:
                  input: ${event.input}
                  status: "${event.status == '__ALL__' ? '' : event.status}"
                  pageNo: 1
              - action: reload
                params:
                  dataSource: types
          children:
            - type: Field
              props:
                label: 编码/名称
              children:
                - type: Input
                  props:
                    name: input
            - type: Field
              props:
                label: 状态
              children:
                - type: FilterSelect
                  props:
                    name: status
                    placeholder: 全部
                    options:
                      - { label: 全部, value: "" }
                      - { label: 启用, value: ENABLED }
                      - { label: 禁用, value: DISABLED }
            - type: Field
              props:
                label: " "
              children:
                - type: Flex
                  props:
                    gap: small
                    align: center
                  children:
                    - type: Button
                      props:
                        text: 查询
                        submit: true
                        htmlType: submit
                    - type: Button
                      props:
                        text: 重置
                      events:
                        onClick:
                          - action: form.setValues
                            params:
                              form: dictSearch
                              values:
                                input: ""
                                status: __ALL__
                          - action: setState
                            params:
                              input: ""
                              status: ""
                              pageNo: 1
                          - action: reload
                            params:
                              dataSource: types
        - type: Table
          props:
            rowKey: dictionaryTypeId
            dataSource: ${data.types.records}
            loading: ${dataStatus.types.loading}
            className: mt-4
            columns:
              - title: 类型名称
                cell:
                  type: Button
                  props:
                    variant: link
                    size: small
                  children:
                    - type: I18nText
                      props:
                        value: ${row.typeName}
                  events:
                    onClick: &openViewDrawer
                      - action: setState
                        params:
                          typeDrawerOpen: false
                          viewDrawerOpen: true
                          editingTypeId: ${row.dictionaryTypeId}
                          editingTypeCode: ${row.typeCode}
                      - action: reload
                        params:
                          dataSource: editing
                      - action: reload
                        params:
                          dataSource: typeItems
              - title: 类型编码
                dataIndex: typeCode
              - title: 状态
                dataIndex: status
              - title: 操作
                cell:
                  type: Flex
                  props:
                    gap: small
                    align: center
                  children:
                    - type: Button
                      props:
                        text: 查看
                        variant: link
                        size: small
                      events:
                        onClick: *openViewDrawer
                    - type: Button
                      props:
                        text: 编辑
                        variant: link
                        size: small
                      events:
                        onClick: &openEditDrawer
                          - action: setState
                            params:
                              viewDrawerOpen: false
                              drawerMode: edit
                              editingTypeId: ${row.dictionaryTypeId}
                              editingTypeCode: ${row.typeCode}
                          - action: reload
                            params:
                              dataSource: editing
                          - action: reload
                            params:
                              dataSource: typeItems
                          - action: setState
                            params:
                              typeDrawerOpen: true
        - type: Text
          props:
            text: 共 ${data.types.total} 种类型
            type: secondary
            className: mt-3
    - type: DrawerBackdrop
      props:
        open: "${state.viewDrawerOpen || state.typeDrawerOpen}"
      events:
        onClose: &closeDictDrawers
          - action: setState
            params:
              viewDrawerOpen: false
              typeDrawerOpen: false
    - type: Drawer
      props:
        open: ${state.viewDrawerOpen}
        placement: right
        title: 查看字典
        footer: false
        style: { width: "840px", maxWidth: "840px" }
      events:
        onClose: *closeDictDrawers
      children:
        - type: DictionaryTypeViewPanel
          props:
            loading: ${dataStatus.editing.loading || dataStatus.typeItems.loading}
            typeData: ${data.editing}
            itemsData: ${data.typeItems.records}
    - type: Drawer
      props:
        open: ${state.typeDrawerOpen}
        placement: right
        title: "${state.drawerMode == 'create' ? '新建字典' : '编辑字典'}"
        okText: 保存全部
        cancelText: 取消
        style: { width: "840px", maxWidth: "840px" }
      events:
        onOk: &dictTypeSaveOnOk
          - action: dictionaryType.persist
          - action: message
            params:
              messageType: success
              text: "${state.drawerMode == 'create' ? '字典类型已创建' : '已保存'}"
          - action: setState
            params:
              viewDrawerOpen: false
              typeDrawerOpen: false
          - action: reload
            params:
              dataSource: types
        onClose: *closeDictDrawers
      children:
        - type: DictionaryTypeSavePanel
          props:
            hideFooter: true
            mode: ${state.drawerMode}
            typeData: "${state.drawerMode == 'edit' ? data.editing : null}"
            itemsData: "${state.drawerMode == 'edit' ? data.typeItems.records : null}"
