dsl: "1.0"
page:
  id: dictionary-type-list
  title: 数据字典
  name: dictionaryTypeList

state:
  input: ""
  status: ""
  pageNo: 1
  pageSize: 20
  editingTypeId: ""
  editingTypeCode: ""

dataSources:
  types:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/platform/dictionary-types
      params:
        input: ${state.input}
        status: ${state.status}
        pageNo: ${state.pageNo}
        pageSize: ${state.pageSize}
  editing:
    type: http
    autoLoad: false
    request:
      method: GET
      url: /api/d/platform/dictionary-types/${state.editingTypeId}
  typeItems:
    type: http
    autoLoad: false
    request:
      method: GET
      url: /api/d/platform/dictionary-types/${state.editingTypeCode}/items
      params:
        pageNo: 1
        pageSize: 200

body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 系统管理
          - label: 数据字典
    - type: Flex
      props:
        justify: space-between
        align: center
      children:
        - type: Flex
          props:
            direction: vertical
            gap: 2
          children:
            - type: Typography
              props:
                variant: h3
                text: 数据字典
            - type: Typography
              props:
                variant: muted
                text: 维护业务可复用的字典类型和对应的值。
        - type: Button
          props:
            text: + 新建类型
            variant: primary
          events:
            onClick:
              - action: setState
                params:
                  editingTypeId: ""
                  editingTypeCode: ""
              - action: overlay.open
                params:
                  overlay: &typeDrawer
                    type: drawer
                    title: "${state.editingTypeId == '' ? '新建字典类型' : '编辑字典类型'}"
                    width: 840
                    content:
                      type: DictionaryTypeSavePanel
                      props:
                        mode: "${state.editingTypeId == '' ? 'create' : 'edit'}"
                        typeData: ${data.editing}
                        itemsData: ${data.typeItems.records}
                      events:
                        onCancel:
                          - action: overlay.close
                        onSave:
                          - action: if
                            params:
                              condition: ${event.mode == 'create'}
                              then:
                                - action: request
                                  params:
                                    method: POST
                                    url: /api/d/platform/dictionary-types
                                    body:
                                      typeCode: ${event.typeCode}
                                      typeName: ${event.typeName}
                                      items: ${event.items}
                              else:
                                - action: request
                                  params:
                                    method: PUT
                                    url: /api/d/platform/dictionary-types/${state.editingTypeId}
                                    body:
                                      typeName: ${event.typeName}
                                      items: ${event.items}
                          - action: message
                            params:
                              messageType: success
                              text: 已保存
                          - action: overlay.close
                          - action: reload
                            params:
                              dataSource: types
    - type: Card
      children:
        - type: Form
          props:
            name: dictSearch
            layout: inline
            initialValues:
              input: ${state.input}
              status: "${state.status == '' ? '__ALL__' : state.status}"
          events:
            onSubmit:
              - action: setState
                params:
                  input: ${event.input}
                  status: "${event.status == '__ALL__' ? '' : event.status}"
                  pageNo: 1
              - action: reload
                params:
                  dataSource: types
          children:
            - type: Field
              props:
                label: 编码/名称
              children:
                - type: Input
                  props:
                    name: input
            - type: Field
              props:
                label: 状态
              children:
                - type: FilterSelect
                  props:
                    name: status
                    placeholder: 全部
                    options:
                      - { label: 全部, value: "" }
                      - { label: 启用, value: ENABLED }
                      - { label: 禁用, value: DISABLED }
            - type: Field
              props:
                label: " "
              children:
                - type: Flex
                  props:
                    gap: small
                    align: center
                  children:
                    - type: Button
                      props:
                        text: 查询
                        submit: true
                        htmlType: submit
                    - type: Button
                      props:
                        text: 重置
                      events:
                        onClick:
                          - action: form.setValues
                            params:
                              form: dictSearch
                              values:
                                input: ""
                                status: __ALL__
                          - action: setState
                            params:
                              input: ""
                              status: ""
                              pageNo: 1
                          - action: reload
                            params:
                              dataSource: types
        - type: Table
          props:
            rowKey: dictionaryTypeId
            dataSource: ${data.types.records}
            loading: ${dataStatus.types.loading}
            className: mt-4
            columns:
              - title: 类型名称
                cell:
                  type: Button
                  props:
                    variant: link
                    size: small
                  children:
                    - type: I18nText
                      props:
                        value: ${row.typeName}
                  events:
                    onClick: &editType
                      - action: setState
                        params:
                          editingTypeId: ${row.dictionaryTypeId}
                          editingTypeCode: ${row.typeCode}
                      - action: reload
                        params:
                          dataSource: editing
                      - action: reload
                        params:
                          dataSource: typeItems
                      - action: overlay.open
                        params:
                          overlay: *typeDrawer
              - title: 类型编码
                dataIndex: typeCode
              - title: 安全域
                dataIndex: securityRealm
              - title: 状态
                dataIndex: status
              - title: 操作
                cell:
                  type: Button
                  props:
                    text: 编辑
                    variant: link
                    size: small
                  events:
                    onClick: *editType
        - type: Text
          props:
            text: 共 ${data.types.total} 种类型
            type: secondary
            className: mt-3
