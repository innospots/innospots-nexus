dsl: "1.0"
page:
  id: audit-log-list
  title: '$i18n{audit.audit-log-list.title:审计日志}'
  name: auditLogList

state:
  timeRange: last7d
  operator: ""
  operationType: ""
  result: ""
  keyword: ""
  pageNo: 1
  pageSize: 20

dataSources:
  logs:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/platform/audit-logs
      params:
        timeRange: ${state.timeRange}
        operator: ${state.operator}
        operationType: ${state.operationType}
        result: ${state.result}
        keyword: ${state.keyword}
        pageNo: ${state.pageNo}
        pageSize: ${state.pageSize}
i18n:
  namespaces:
    - audit
body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label:
              '$i18n{audit.audit-log-list.system-management:系统管理}'
          - label:
              '$i18n{audit.audit-log-list.audit-logs:审计日志}'
    - type: Flex
      props:
        justify: space-between
        align: center
      children:
        - type: Flex
          props:
            direction: vertical
            gap: 2
          children:
            - type: Typography
              props:
                variant: h3
                text: '$i18n{audit.audit-log-list.audit-logs-2:审计日志}'
            - type: Typography
              props:
                variant: muted
                text: '$i18n{audit.audit-log-list.review-management-activity-sensitive-parameters-are-masked-according-to:查询管理操作轨迹；敏感参数按安全策略脱敏展示。}'
        - type: Flex
          props:
            gap: small
          children:
            - type: Button
              props:
                text: '$i18n{audit.audit-log-list.refresh:刷新}'
              events:
                onClick:
                  - action: reload
                    params:
                      dataSource: logs
    - type: Card
      children:
        - type: Form
          props:
            name: auditSearch
            layout: inline
            initialValues:
              timeRange: ${state.timeRange}
              operator: ${state.operator}
              operationType: "${state.operationType == '' ? '__ALL__' : state.operationType}"
              result: "${state.result == '' ? '__ALL__' : state.result}"
              keyword: ${state.keyword}
          events:
            onSubmit:
              - action: setState
                params:
                  timeRange: ${event.timeRange}
                  operator: ${event.operator}
                  operationType: "${event.operationType == '__ALL__' ? '' : event.operationType}"
                  result: "${event.result == '__ALL__' ? '' : event.result}"
                  keyword: ${event.keyword}
                  pageNo: 1
              - action: reload
                params:
                  dataSource: logs
          children:
            - type: Field
              props:
                label: '$i18n{audit.audit-log-list.time-range:时间范围}'
              children:
                - type: Select
                  props:
                    name: timeRange
                    placeholder: '$i18n{audit.audit-log-list.last-7-days-2:最近 7 天}'
                    options:
                      - label:
                          '$i18n{audit.audit-log-list.last-7-days:最近 7 天}'
                        value: last7d
                      - label:
                          '$i18n{audit.audit-log-list.last-24-hours:最近 24 小时}'
                        value: last24h
                      - label:
                          '$i18n{audit.audit-log-list.last-30-days:最近 30 天}'
                        value: last30d
            - type: Field
              props:
                label: '$i18n{audit.audit-log-list.actor:操作者}'
              children:
                - type: Input
                  props:
                    name: operator
            - type: Field
              props:
                label: '$i18n{audit.audit-log-list.action-type:操作类型}'
              children:
                - type: FilterSelect
                  props:
                    name: operationType
                    placeholder: '$i18n{audit.audit-log-list.all-2:全部}'
                    options:
                      - label:
                          '$i18n{audit.audit-log-list.all:全部}'
                        value: ""
                      - label:
                          '$i18n{audit.audit-log-list.search:查询}'
                        value: READ
                      - label:
                          '$i18n{audit.audit-log-list.create:创建}'
                        value: CREATE
                      - label:
                          '$i18n{audit.audit-log-list.update:更新}'
                        value: UPDATE
                      - label:
                          '$i18n{audit.audit-log-list.delete:删除}'
                        value: DELETE
                      - label:
                          '$i18n{audit.audit-log-list.status-change:状态变更}'
                        value: STATUS
                      - label:
                          '$i18n{audit.audit-log-list.replace-all:全量替换}'
                        value: REPLACE
                      - label:
                          '$i18n{audit.audit-log-list.execute:执行}'
                        value: EXECUTE
                      - label:
                          '$i18n{audit.audit-log-list.export:导出}'
                        value: EXPORT
                      - label:
                          '$i18n{audit.audit-log-list.import:导入}'
                        value: IMPORT
                      - label:
                          '$i18n{audit.audit-log-list.authorization-binding:授权绑定}'
                        value: ASSIGN
                      - label:
                          '$i18n{audit.audit-log-list.remove-authorization:解除授权}'
                        value: REVOKE
                      - label:
                          '$i18n{audit.audit-log-list.write:写入}'
                        value: WRITE
            - type: Field
              props:
                label: '$i18n{audit.audit-log-list.result:结果}'
              children:
                - type: FilterSelect
                  props:
                    name: result
                    placeholder: '$i18n{audit.audit-log-list.all-4:全部}'
                    options:
                      - label:
                          '$i18n{audit.audit-log-list.all-3:全部}'
                        value: ""
                      - label:
                          '$i18n{audit.audit-log-list.success:成功}'
                        value: SUCCESS
                      - label:
                          '$i18n{audit.audit-log-list.failed:失败}'
                        value: FAILURE
            - type: Field
              props:
                label: '$i18n{audit.audit-log-list.keyword:关键字}'
              children:
                - type: Input
                  props:
                    name: keyword
                    placeholder: '$i18n{audit.audit-log-list.action-type-target-description-method:操作类型/对象/说明/方法}'
            - type: Field
              props:
                label:  
              children:
                - type: Flex
                  props:
                    gap: small
                    align: center
                  children:
                    - type: Button
                      props:
                        text: '$i18n{audit.audit-log-list.search-2:查询}'
                        submit: true
                        htmlType: submit
                    - type: Button
                      props:
                        text: '$i18n{audit.audit-log-list.reset:重置}'
                      events:
                        onClick:
                          - action: form.setValues
                            params:
                              form: auditSearch
                              values:
                                timeRange: last7d
                                operator: ""
                                operationType: __ALL__
                                result: __ALL__
                                keyword: ""
                          - action: setState
                            params:
                              timeRange: last7d
                              operator: ""
                              operationType: ""
                              result: ""
                              keyword: ""
                              pageNo: 1
                          - action: reload
                            params:
                              dataSource: logs
        - type: Table
          props:
            rowKey: logId
            dataSource: ${data.logs.records}
            loading: ${dataStatus.logs.loading}
            className: mt-4
            columns:
              - title:
                  '$i18n{audit.audit-log-list.time:时间}'
                dataIndex: occurredAt
              - title:
                  '$i18n{audit.audit-log-list.action-type-2:操作类型}'
                dataIndex: operationType
              - title:
                  '$i18n{audit.audit-log-list.target:操作对象}'
                dataIndex: target
              - title:
                  '$i18n{audit.audit-log-list.action-description:操作说明}'
                dataIndex: summary
              - title:
                  '$i18n{audit.audit-log-list.actor-2:操作者}'
                dataIndex: operatorName
              - title:
                  '$i18n{audit.audit-log-list.result-2:结果}'
                dataIndex: result
              - title:
                  '$i18n{audit.audit-log-list.duration:耗时}'
                cell:
                  type: Text
                  props:
                    text: "${row.durationMs != null ? row.durationMs + ' ms' : '—'}"
              - title:
                  '$i18n{audit.audit-log-list.details:详情}'
                cell:
                  type: Button
                  props:
                    text: '$i18n{audit.audit-log-list.view:查看}'
                    variant: link
                    size: small
                  events:
                    onClick:
                      - action: navigate
                        params:
                          to: /system/audit-logs/${row.logId}
        - type: Text
          props:
            text: "${t('audit.audit-log-list.summary.count', { count: data.logs.total })}"
            type: secondary
            className: mt-3
