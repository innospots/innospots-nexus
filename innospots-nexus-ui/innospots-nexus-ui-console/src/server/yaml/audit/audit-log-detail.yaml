dsl: "1.0"
page:
  id: audit-log-detail
  title: 审计日志详情
  name: auditLogDetail

dataSources:
  log:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/platform/audit-logs/${params.logId}

body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 审计日志
            href: /system/audit-logs
          - label: 记录详情
    - type: Button
      props:
        text: ← 返回审计日志
        variant: link
      events:
        onClick:
          - action: navigate
            params: { to: /system/audit-logs }
    - type: Flex
      props:
        justify: space-between
        align: center
        className: mt-2
      children:
        - type: Flex
          props:
            direction: vertical
            gap: 2
          children:
            - type: Typography
              props:
                variant: h3
                text: "${data.log.summary != null && data.log.summary != '' ? data.log.summary : data.log.operationType}"
            - type: Flex
              props:
                gap: small
                align: center
              children:
                - type: Badge
                  props:
                    text: ${data.log.operationType}
                - type: Badge
                  props:
                    text: ${data.log.result}
                - type: Text
                  props:
                    text: ${data.log.target}
                    type: secondary
        - type: Button
          props:
            text: 复制日志 ID
          events:
            onClick:
              - action: message
                params:
                  messageType: success
                  text: 已复制 ${params.logId}
    - type: Card
      props:
        className: mt-4
      children:
        - type: Text
          props:
            text: 操作信息
            strong: true
        - type: Descriptions
          props:
            className: mt-2
            bordered: true
            column: 2
            items:
              - { label: 操作时间, value: "${data.log.occurredAt}" }
              - { label: 操作类型, value: "${data.log.operationType}" }
              - { label: 操作对象, value: "${data.log.target}" }
              - { label: 操作说明, value: "${data.log.summary}" }
              - { label: 操作者, value: "${data.log.operatorName}" }
              - { label: 用户 ID, value: "${data.log.operatorId}" }
              - { label: 安全域, value: "${data.log.securityRealm}" }
    - type: Card
      props:
        className: mt-4
      children:
        - type: Text
          props:
            text: 执行结果
            strong: true
        - type: Descriptions
          props:
            className: mt-2
            bordered: true
            column: 2
            items:
              - { label: 执行方法, value: "${data.log.method}" }
              - { label: 状态, value: "${data.log.result}" }
              - { label: 耗时, value: "${data.log.durationMs != null ? data.log.durationMs + ' ms' : '—'}" }
              - { label: 错误码, value: "${data.log.errorCode != null && data.log.errorCode != '' ? data.log.errorCode : '—'}" }
        - type: Alert
          when: ${data.log.failureDetail != null && data.log.failureDetail != ''}
          props:
            className: mt-3
            variant: error
            message: ${data.log.failureDetail}
    - type: Card
      when: ${data.log.requestPayload != null && data.log.requestPayload != ''}
      props:
        className: mt-4
      children:
        - type: Text
          props:
            text: 请求参数（敏感字段已脱敏）
            strong: true
        - type: Text
          props:
            text: ${data.log.requestPayload}
            className: mt-2 font-mono text-sm
