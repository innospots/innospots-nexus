dsl: "1.0"
page:
  id: menu-config
  title: 自定义导航
  name: menuConfig

state:
  treeSearch: ""
  selectedMenuId: ""
  structureDirty: false

dataSources:
  menuTree:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/nexus/console-menus/tree
  pageOptions:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/nexus/catalog/tree
  selectedMenu:
    type: http
    autoLoad: false
    request:
      method: GET
      url: /api/d/nexus/console-menus/${state.selectedMenuId}

body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 系统管理
          - label: 菜单管理
    - type: Flex
      props:
        justify: space-between
        align: center
      children:
        - type: Flex
          props:
            direction: vertical
            gap: 2
          children:
            - type: Typography
              props:
                variant: h3
                text: 自定义导航
            - type: Typography
              props:
                variant: muted
                text: 配置侧栏导航结构。菜单显示与资源授权相互独立。
        - type: Flex
          props:
            gap: small
          children:
            - type: Button
              props:
                text: 预览
              events:
                onClick:
                  - action: message
                    params:
                      messageType: info
                      text: 预览当前导航树层级与可见状态（演示）
            - type: Button
              props:
                text: + 新建菜单
                variant: primary
              events:
                onClick:
                  - action: setState
                    params:
                      selectedMenuId: ""
                  - action: form.setValues
                    params:
                      form: menuForm
                      values:
                        menuName: ""
                        menuType: DIRECTORY
                        pageKey: ""
                        parentMenuId: ""
                        icon: ""
                        sortOrder: 10
                        visible: true
    - type: Flex
      props:
        gap: middle
        align: stretch
        className: mt-4
      children:
        - type: Card
          props:
            style: { flex: 1, minWidth: 300 }
          children:
            - type: Text
              props:
                text: 自定义菜单
                strong: true
            - type: Input
              props:
                value: ${state.treeSearch}
                placeholder: 搜索菜单
                className: mt-2
              events:
                onChange:
                  - action: setState
                    params:
                      treeSearch: ${event}
            - type: Tree
              props:
                className: mt-2
                treeData: ${data.menuTree}
                fieldNames:
                  title: menuName
                  key: menuId
                  children: children
              events:
                onSelect:
                  - action: setState
                    params:
                      selectedMenuId: ${event.key}
                  - action: reload
                    params:
                      dataSource: selectedMenu
            - type: Flex
              props:
                gap: small
                className: mt-3
              children:
                - type: Button
                  props:
                    text: ＋ 同级
                    size: small
                - type: Button
                  props:
                    text: ＋ 子级
                    size: small
                - type: Button
                  props:
                    text: 删除
                    size: small
                    danger: true
                  events:
                    onClick:
                      - action: confirm
                        params:
                          title: 删除菜单
                          content: 删除后不可恢复，确定吗？
                      - action: request
                        params:
                          method: DELETE
                          url: /api/d/nexus/console-menus/${state.selectedMenuId}
                      - action: reload
                        params:
                          dataSource: menuTree
            - type: Text
              props:
                text: 拖动可排序/调整层级；结构变更后点击底部「保存菜单结构」统一提交。
                type: secondary
                className: mt-2
        - type: Card
          props:
            style: { flex: 2 }
          children:
            - type: Text
              props:
                text: 菜单配置
                strong: true
            - type: Form
              props:
                name: menuForm
                layout: vertical
                className: mt-2
                initialValues: ${data.selectedMenu}
              events:
                onSubmit:
                  - action: if
                    params:
                      condition: ${state.selectedMenuId == ''}
                      then:
                        - action: request
                          params:
                            method: POST
                            url: /api/d/nexus/console-menus
                            body:
                              menuName: ${event.menuName}
                              menuType: ${event.menuType}
                              pageKey: ${event.pageKey}
                              parentMenuId: ${event.parentMenuId}
                              icon: ${event.icon}
                              sortOrder: ${event.sortOrder}
                              visible: ${event.visible}
                      else:
                        - action: request
                          params:
                            method: PUT
                            url: /api/d/nexus/console-menus/${state.selectedMenuId}
                            body:
                              menuName: ${event.menuName}
                              menuType: ${event.menuType}
                              pageKey: ${event.pageKey}
                              parentMenuId: ${event.parentMenuId}
                              icon: ${event.icon}
                              sortOrder: ${event.sortOrder}
                              visible: ${event.visible}
                  - action: message
                    params:
                      messageType: success
                      text: 菜单已保存
                  - action: reload
                    params:
                      dataSource: menuTree
              children:
                - type: Field
                  props:
                    label: 菜单名称
                    required: true
                  children:
                    - type: Input
                      props:
                        name: menuName
                        rules:
                          - required: true
                            message: 请输入菜单名称
                - type: Field
                  props:
                    label: 菜单类型
                    required: true
                  children:
                    - type: RadioGroup
                      props:
                        name: menuType
                        options:
                          - { label: 目录, value: DIRECTORY }
                          - { label: 页面入口, value: PAGE }
                          - { label: 外部链接, value: EXTERNAL_LINK }
                - type: Field
                  props:
                    label: 页面入口
                    labelHint: 页面类型必选
                  children:
                    - type: Select
                      props:
                        name: pageKey
                        placeholder: 从已注册页面选择
                        options: ${data.pageOptions}
                - type: Field
                  props:
                    label: 上级菜单
                  children:
                    - type: Select
                      props:
                        name: parentMenuId
                        allowClear: true
                        placeholder: 选择目录节点
                - type: Grid
                  props:
                    columns: 2
                    gap: 16
                  children:
                    - type: Field
                      props:
                        label: 图标
                      children:
                        - type: Input
                          props:
                            name: icon
                            placeholder: shield
                    - type: Field
                      props:
                        label: 排序
                      children:
                        - type: NumberInput
                          props:
                            name: sortOrder
                            min: 0
                - type: Field
                  props:
                    label: 显示
                  children:
                    - type: Switch
                      props:
                        name: visible
                - type: Flex
                  props:
                    justify: end
                    gap: small
                    className: mt-4
                  children:
                    - type: Button
                      props:
                        text: 取消
                      events:
                        onClick:
                          - action: reload
                            params:
                              dataSource: selectedMenu
                    - type: Button
                      props:
                        text: 保存
                        variant: primary
                        submit: true
                        htmlType: submit
    - type: Flex
      props:
        justify: space-between
        align: center
        className: mt-4
      children:
        - type: Text
          props:
            text: "${state.structureDirty ? '结构有未保存调整' : ''}"
            type: secondary
        - type: Flex
          props:
            gap: small
          children:
            - type: Button
              props:
                text: 撤销调整
                disabled: ${!state.structureDirty}
            - type: Button
              props:
                text: 保存菜单结构
                variant: primary
              events:
                onClick:
                  - action: request
                    params:
                      method: PUT
                      url: /api/d/nexus/console-menus/tree
                      body:
                        menuIds: []
                  - action: message
                    params:
                      messageType: success
                      text: 菜单结构已保存
                  - action: setState
                    params:
                      structureDirty: false
    - type: Alert
      props:
        className: mt-4
        variant: warning
        message: "菜单 CRUD 与树排序 REST 尚未在 OpenAPI 中发布；当前页面已按 PRD 线框接线至 /api/d/nexus/console-menus/*，后端就绪后无需改 DSL 路径。只读导航可参考 GET /api/d/platform/navigation/menus。"
