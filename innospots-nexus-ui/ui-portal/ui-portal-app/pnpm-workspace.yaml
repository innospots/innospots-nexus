allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@pactor-app/app@1.72.0'
  - '@pactor-app/blocks@1.72.0'
  - '@pactor-app/chart@1.72.0'
  - '@pactor-app/chat@1.72.0'
  - '@pactor-app/cli@1.72.0'
  - '@pactor-app/core@1.72.0'
  - '@pactor-app/expression@1.72.0'
  - '@pactor-app/i18n@1.72.0'
  - '@pactor-app/markdown@1.72.0'
  - '@pactor-app/module-pack@1.72.0'
  - '@pactor-app/permission@1.72.0'
  - '@pactor-app/resource@1.72.0'
  - '@pactor-app/router@1.72.0'
  - '@pactor-app/runtime@1.72.0'
  - '@pactor-app/schema@1.72.0'
  - '@pactor-app/ui@1.72.0'
  - '@pactor-app/vite-plugin@1.72.0'
  - pactor-app@1.72.0
# 模板独立安装（pnpm install）时批准运行构建脚本的原生依赖。
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
