# 租户控制台服务：控制台认证与凭据（innospots-nexus-spring-console）
#
# 绑定: com.innospots.nexus.spring.console.config.ConsoleAuthProperties
#       com.innospots.nexus.spring.console.config.ConsoleCredentialTotpProperties
# 装配: ConsoleAuthConfiguration, ConsoleCredentialConfiguration, KernelAuthConfiguration
#
nexus:
  console:
    auth:
      token-secret: "0123456789abcdef"
      access-token-ttl-seconds: 7200
      refresh-token-ttl-seconds: 604800
      tenant-login-captcha-enabled: false
      platform-login-captcha-enabled: true
      login-max-failed-attempts: 5
      login-lock-minutes: 15
      rsa:
        private-key: 
    credential:
      totp:
        # master-key: "change-me-in-production"
