# ---------------------------------------------------------------------------
# 控制台认证（示例值；生产请更换密钥）
#
# 绑定: com.innospots.nexus.spring.console.config.ConsoleAuthProperties
# 装配: ConsoleAuthConfiguration → com.innospots.nexus.console.config.AuthConfig
# ---------------------------------------------------------------------------
nexus:
  console:
    auth:
      # 紧凑令牌 AES 密钥；未配置时使用 AuthConfig.DEFAULT_TOKEN_SECRET
      token-secret: "0123456789abcdef"
      # 访问令牌有效期（秒）；默认 7200
      access-token-ttl-seconds: 7200
      # 刷新令牌有效期（秒）；默认 604800
      refresh-token-ttl-seconds: 604800
      # 租户域登录是否要求图形验证码；默认 true
      tenant-login-captcha-enabled: true
      # 平台域登录是否要求图形验证码；默认 true
      platform-login-captcha-enabled: false
      # 连续登录失败锁定阈值；默认 5
      login-max-failed-attempts: 5
      # 登录锁定时长（分钟）；默认 15
      login-lock-minutes: 15
      rsa:
        # PEM 或 Base64 RSA 私钥；配置后启用登录密码 RSA 解密（PasswordDecryptor）
        private-key: 
