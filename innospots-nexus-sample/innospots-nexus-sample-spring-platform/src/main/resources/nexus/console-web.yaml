# ---------------------------------------------------------------------------
# 控制台 Jersey Web 横切（鉴权 Filter、CORS、异常映射、RequestId）
#
# 绑定: com.innospots.nexus.spring.console.config.ConsoleWebProperties
# 装配: ConsoleJaxRsWebConfiguration
#
# 由 application.yaml 的 spring.config.import 直接引入；支持 Jersey Servlet 与 Filter 两种模式。
# 关闭 nexus.console.web.enabled 时不注册过滤器与 ExceptionMapper。
# ---------------------------------------------------------------------------
nexus:
  console:
    web:
      # 是否启用 Web 横切；默认 true（与 @ConditionalOnProperty matchIfMissing 一致）
      enabled: true
      # Jersey 路由
      # jersey:
      #   root-path: /openapi/ui          # GET / 重定向目标（默认 Scalar 文档页）
      security:
        # 请求侧安全总开关（Bearer 鉴权 + ConsoleResourcePermissionFilter）；默认 true。
        # 关闭后不做鉴权与资源 permission 判定；登录/令牌仍由 console-auth.yaml 配置（仅建议本地调试）。
        enabled: false

        # dev-session：仅当 security.enabled=false 时生效；注入固定 SessionContext（本地调试）。
        # 本模块为运营平台（platform）示例：realm 须为 PLATFORM，与平台登录令牌域一致。
        # 生产务必保持 dev-session.enabled=false；建议配合 spring.profiles.active 含 dev。
        dev-session:
          enabled: true
          user-id: "1"
          tenant-id: dev-tenant
          # workspace-id: dev-workspace   # TENANT 会话可不配；WORKSPACE 会话须配置
          project-id: dev-project
          realm: PLATFORM
          # 当前登录会话归属：PLATFORM | TENANT | WORKSPACE（可与 realm、workspace-id 组合调试角色 API）
          session-scope: PLATFORM
          tenant-member-id: member-1

        # permit-all-patterns：ConsoleAuthenticationFilter 使用（security.enabled=true 时）。
        # 命中则跳过 Bearer 令牌校验（OpenAPI、登录、健康检查等）；与下方 console 资源权限配置无关。
        # permit-all-patterns:
        #   - /openapi/**
        #   - /auth/**
        #   - /tenant/auth/**
        #   - /platform/public/**
        #   - /platform/auth/refresh
        # /api/public/** 不在 permit-all：无 Authorization 可访问；若携带 Bearer 仍由 ConsoleAuthenticationFilter 校验。
        #   - /health
        #   - /actuator/health/**

        # console-path-patterns：ConsoleResourcePermissionFilter 使用（非 ConsoleAuthenticationFilter）。
        # 命中表示该 URL 须做「控制台资源级」授权：在已通过 Bearer 登录的前提下，
        # 读取请求上的 ResolvedEndpointGrant，按 grantName:domainKey.moduleKey 拼资源键，
        # 由 ConsoleResourcePermissionAuthorizer 判定是否落在 nx_permission_grant。
        # 默认 /api/d/**；设为空列表 [] 则关闭资源级授权（不推荐生产环境）。
        # console-path-patterns:
        #   - /api/d/**
      cors:
        # 是否输出 CORS 响应头（Jersey ConsoleCorsFilter）；本地 UI 直连 API 时开启
        enabled: true
        allowed-origins:
          - "*"
        allowed-methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
          - HEAD
        allowed-headers:
          - "*"
        exposed-headers: []
        # 带 Cookie 会话时改为 true，且 allowed-origins 须列出具体源（不能用 *）
        allow-credentials: false
        max-age-seconds: 3600
