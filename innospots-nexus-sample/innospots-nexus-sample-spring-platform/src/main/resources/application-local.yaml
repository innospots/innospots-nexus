# spring.profiles.active=local — 仅数据源差异化（公共项见 application.yaml）
spring:
  datasource:
    # 嵌入式文件库，落盘至 ./out/db/（相对进程工作目录，通常为模块根目录）
    url: jdbc:h2:file:./out/db/nexus-platform-console;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      # Spring Boot 4 的 embedded 模式仅识别 jdbc:h2:mem，file 库须用 always（脚本均为 CREATE IF NOT EXISTS）
      mode: always
      # 本模块 src/main/resources/schema/*.sql，按 core → plugin → console → platform 顺序执行
      schema-locations:
        - classpath:schema/nexus-core-h2.sql
        - classpath:schema/nexus-plugin-h2.sql
        - classpath:schema/nexus-console-h2.sql
        - classpath:schema/nexus-platform-h2.sql
