# spring.profiles.active=local — 仅数据源差异化（公共项见 application.yaml）
logging:
  level:
    # 角色列表/创建归属调试（见 ConsoleOwnershipScope、RoleOperator）
    com.innospots.nexus.console.scope.ConsoleOwnershipScope: debug
    com.innospots.nexus.console.role.operator.RoleOperator: debug
spring:
  datasource:
    # 嵌入式文件库，落盘至 ./out/db/（相对进程工作目录，通常为模块根目录）
    url: jdbc:h2:file:./out/db/nexus-platform-console;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  sql:
    init:
      # Spring Boot 4 的 embedded 模式仅识别 jdbc:h2:mem，file 库须用 always（脚本均为 CREATE IF NOT EXISTS）
      mode: always
      # 本模块 src/main/resources/schema/*.sql，按 core → plugin → console → platform 顺序执行
      schema-locations:
        - classpath:schema/nexus-core-h2.sql
        - classpath:schema/nexus-plugin-h2.sql
        - classpath:schema/nexus-console-h2.sql
        - classpath:schema/nexus-platform-h2.sql
      # 不再使用 SQL 种子初始化角色、授权与用户：
      # 全部由 console/bootstrap/{roles,users}.yaml + console.bootstrap 启动管线完成，
      # 顺序为 资源目录 → 角色 → 角色授权 → 用户 → 用户角色绑定。
