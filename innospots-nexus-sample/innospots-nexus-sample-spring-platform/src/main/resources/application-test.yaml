# spring.profiles.active=test — H2 内存库（集成测试 / CI）
spring:
  datasource:
    url: jdbc:h2:mem:nexus-platform-console-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  sql:
    init:
      mode: embedded
      schema-locations:
        - classpath:schema/nexus-core-h2.sql
        - classpath:schema/nexus-plugin-h2.sql
        - classpath:schema/nexus-console-h2.sql
        - classpath:schema/nexus-platform-h2.sql
