spring:
  profiles:
    default: local
  application:
    name: nexus-platform-console
  jersey:
    # Jersey Servlet 直接处理 Jakarta REST 与 Scalar 文档路由
    type: servlet
  config:
    import:
      # 控制台示例配置（完整分项见 classpath:nexus/console-*.yaml）
      - optional:classpath:nexus/console-auth.yaml
      - optional:classpath:nexus/console-credential.yaml
      - optional:classpath:nexus/console-web.yaml
      - optional:classpath:nexus/console-openapi.yaml
      - optional:classpath:nexus/console-plugins.yaml
      # 本地覆盖：可选放置同名文件，例如 optional:file:./config/nexus/console-web.yaml

server:
  port: 8082

# Actuator 端点由 Boot 的 Jersey 集成注册到 JAX-RS。
management:
  endpoints:
    web:
      exposure:
        include: info,health,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
