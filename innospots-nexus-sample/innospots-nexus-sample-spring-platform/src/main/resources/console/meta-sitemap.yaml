# 运营平台默认菜单（meta-sitemap）；menus 结构与前端 sitemap.yaml 对齐。
# catalog 浏览授权：grant key = {domainKey}.{moduleKey}:{viewGroup}（viewGroup 缺省 view）
id: platform-console
title: Innospots Platform Console
description: 运营管理平台
version: 1
updatedAt: "2026-11-03T00:00:00Z"

menus:
