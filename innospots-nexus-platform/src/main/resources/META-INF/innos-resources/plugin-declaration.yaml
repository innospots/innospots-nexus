apiVersion: nexus.plugin/v1
kind: Plugin
metadata:
  pluginId: com.innospots.nexus.platform.console
  version: "0.1.0"
spec:
  apiVersion: 1
  displayName:
    en: Platform Console
    zh: 运营管理平台
  description:
    en: Organizations, platform users, invites, and registration policy.
    zh: 组织开通、平台用户、邀请与注册策略。
  tags:
    kind: entry
    domain: platform
    module: console
    realm: platform
  contributions:
    - type: console
      majorVersion: 2
      domainKey: system
      displayName:
        en: System Management
        zh: 系统管理
      description:
        en: Console theme, settings, audit logs, and dictionaries. Plugin MODULE is contributed by console plugin-management entry (same system domain).
        zh: 主题、系统设置、审计日志与数据字典。插件 MODULE 由 console 内置 plugin-management 贡献（同属 system 领域）。
      orderIndex: 0
      modules:
        - moduleKey: settings
          displayName:
            en: System settings
            zh: 系统设置
          description:
            en: Site name, description, language, timezone, and navigation layout.
            zh: 系统名称、描述、语言、时区与导航布局等基础配置。
          orderIndex: 10
          entryPageKey: system-settings
          icon: setting
          viewGroups:
            - group: view
              label:
                en: Browse system settings pages
                zh: 浏览系统设置页面
          operationGroups:
            - group: operate
              label:
                en: Operations
                zh: 操作
            - group: update
              label:
                en: Update
                zh: 更新
          children: []
        - moduleKey: theme
          displayName:
            en: Theme selection
            zh: 主题选择
          description:
            en: Console color theme and skin selection.
            zh: 控制台配色主题与皮肤选择。
          orderIndex: 20
          entryPageKey: themes
          icon: bg-colors
          viewGroups:
            - group: view
              label:
                en: Browse theme pages
                zh: 浏览主题选择页面
          operationGroups:
            - group: operate
              label:
                en: Operations
                zh: 操作
            - group: update
              label:
                en: Update
                zh: 更新
          children: []
        - moduleKey: logger
          displayName:
            en: Audit logs
            zh: 审计日志
          description:
            en: Platform audit log management.
            zh: 平台审计日志管理。
          orderIndex: 30
          entryPageKey: platform-logger-main
          icon: file-text
          viewGroups:
            - group: view
              label:
                en: Browse audit log pages
                zh: 浏览审计日志页面
          operationGroups:
            - group: operate
              label:
                en: Operations
                zh: 操作
          children: []
        - moduleKey: dictionary
          displayName:
            en: Data dictionary
            zh: 数据字典
          description:
            en: Platform dictionary types and items.
            zh: 平台字典类型与字典项。
          orderIndex: 40
          entryPageKey: platform-dictionary-main
          icon: book
          viewGroups:
            - group: view
              label:
                en: Browse dictionary pages
                zh: 浏览数据字典页面
          operationGroups:
            - group: operate
              label:
                en: Operations
                zh: 操作
            - group: create
              label:
                en: Create
                zh: 创建
            - group: update
              label:
                en: Update
                zh: 更新
            - group: delete
              label:
                en: Delete
                zh: 删除
            - group: status
              label:
                en: Status change
                zh: 状态变更
          children: []
    - type: console
      majorVersion: 2
      domainKey: operation
      displayName:
        en: Operations Management
        zh: 运营管理
      description:
        en: Roles, platform users, tenants, invites, and registration approval.
        zh: 角色、平台用户、租户、邀请与注册审批。
      orderIndex: 1
      modules:
        - moduleKey: role
          displayName:
            en: Role management
            zh: 角色管理
          description:
            en: Platform role management.
            zh: 平台角色管理。
          orderIndex: 10
          entryPageKey: platform-role-main
          icon: team
          viewGroups:
            - group: view
              label:
                en: Browse role management pages
                zh: 浏览角色管理页面
          operationGroups:
            - group: operate
              label:
                en: Operations
                zh: 操作
            - group: create
              label:
                en: Create
                zh: 创建
            - group: update
              label:
                en: Update
                zh: 更新
            - group: delete
              label:
                en: Delete
                zh: 删除
            - group: status
              label:
                en: Status change
                zh: 状态变更
          children: []
        - moduleKey: user
          displayName:
            en: User management
            zh: 用户管理
          description:
            en: Platform users, invites, and registration approval.
            zh: 平台用户列表、邀请与注册审批。
          orderIndex: 20
          entryPageKey: platform-user-main
          icon: team
          viewGroups:
            - group: view
              label:
                en: Browse user management pages
                zh: 浏览用户管理页面
          operationGroups:
            - group: operate
              label:
                en: Operations
                zh: 操作
            - group: create
              label:
                en: Create
                zh: 创建
            - group: update
              label:
                en: Update
                zh: 更新
            - group: delete
              label:
                en: Delete
                zh: 删除
            - group: status
              label:
                en: Status change
                zh: 状态变更
            - group: execute
              label:
                en: Execute
                zh: 执行操作
          children: []
        - moduleKey: organization
          displayName:
            en: Tenant management
            zh: 租户管理
          description:
            en: Platform tenants and enterprise profiles.
            zh: 平台租户开通与生命周期。
          orderIndex: 30
          entryPageKey: platform-organization-main
          icon: apartment
          viewGroups:
            - group: view
              label:
                en: Browse tenant management pages
                zh: 浏览租户管理页面
          operationGroups:
            - group: operate
              label:
                en: Operations
                zh: 操作
            - group: create
              label:
                en: Create
                zh: 创建
            - group: update
              label:
                en: Update
                zh: 更新
            - group: status
              label:
                en: Status change
                zh: 状态变更
            - group: assign
              label:
                en: Assign
                zh: 授权分配
            - group: revoke
              label:
                en: Revoke
                zh: 授权回收
          children: []
