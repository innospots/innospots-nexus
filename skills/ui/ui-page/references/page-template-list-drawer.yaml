dsl: '1.0'

page:
  id: example-list-drawer
  name: exampleListDrawer
  title: 示例列表（抽屉编辑）
  type: list
  permission: example:view

state:
  keyword: ''

dataSources:
  items:
    type: service
    service: example.list
    autoLoad: true
    params:
      keyword: ${state.keyword}

actions:
  search:
    - action: setState
      params:
        keyword: ${event.keyword}
    - action: reload
      params:
        dataSource: items

  openEditDrawer:
    - id: editResult
      action: overlay.open
      params:
        overlay:
          type: drawer
          title: 编辑示例
          width: 480
          params:
            id: ${row.id}
          page:
            pageId: example-edit-drawer
    - action: if
      params:
        condition: ${actions.editResult.success}
        then:
          - action: message
            params:
              type: success
              text: 已保存
          - action: reload
            params:
              dataSource: items

  openCreateDrawer:
    - id: createResult
      action: overlay.open
      params:
        overlay:
          type: drawer
          title: 新建示例
          width: 480
          page:
            pageId: example-edit-drawer
    - action: if
      params:
        condition: ${actions.createResult.success}
        then:
          - action: reload
            params:
              dataSource: items

components:
  searchForm:
    type: Form
    props:
      name: search
      layout: inline
    children:
      - type: Input
        props:
          name: keyword
          label: 关键词
      - type: Button
        props:
          text: 查询
          variant: primary
          submit: true
    events:
      onSubmit:
        action: call
        params:
          name: search

body:
  type: Page
  props:
    title: 示例列表
  children:
    - type: Card
      children:
        - component: searchForm

    - type: Flex
      props:
        justify: end
      children:
        - type: Button
          props:
            text: 新建
            variant: primary
          events:
            onClick:
              action: call
              params:
                name: openCreateDrawer

    - type: Table
      props:
        dataSource: ${data.items}
        rowKey: id
        loading: ${dataStatus.items.loading}
        columns:
          - title: 名称
            dataIndex: name
          - title: 操作
            cell:
              type: Button
              props:
                text: 编辑
                variant: link
                size: small
              events:
                onClick:
                  action: call
                  params:
                    name: openEditDrawer
