dsl: '1.0'

page:
  id: example-master-detail
  name: exampleMasterDetail
  title: 客户主从
  type: list
  permission: example:view

state:
  selectedId: null

dataSources:
  list:
    type: service
    service: example.list
    autoLoad: true

  detail:
    type: service
    service: example.detail
    params:
      id: ${state.selectedId}

actions:
  selectRow:
    - action: setState
      params:
        selectedId: ${row.id}
    - action: reload
      params:
        dataSource: detail

components:
  customerList:
    type: Table
    props:
      dataSource: ${data.list}
      rowKey: id
      loading: ${dataStatus.list.loading}
      pagination: false
      columns:
        - title: 客户
          cell:
            type: Button
            props:
              text: ${row.name}
              variant: link
            events:
              onClick:
                action: call
                params:
                  name: selectRow

  customerDetail:
    type: Card
    props:
      title: 客户详情
    children:
      - type: Alert
        props:
          message: 请选择左侧客户
          variant: info
        when: ${state.selectedId == null}
      - type: Alert
        props:
          message: 详情加载中…
          variant: info
        when: ${state.selectedId != null && dataStatus.detail.loading}
      - type: Grid
        props:
          columns: 2
          gap: 16
        when: ${state.selectedId != null && !dataStatus.detail.loading}
        children:
          - type: Statistic
            props:
              title: 名称
              value: ${data.detail.name}
          - type: Statistic
            props:
              title: 状态
              value: ${data.detail.status}

body:
  type: Page
  props:
    title: 客户主从
  children:
    - type: Flex
      props:
        gap: 16
      children:
        - type: Card
          props:
            title: 客户列表
            style:
              width: 320
          children:
            - component: customerList
        - type: Card
          props:
            title: 详情
            style:
              flex: 1
          children:
            - component: customerDetail
