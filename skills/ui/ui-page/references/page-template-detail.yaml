dsl: '1.0'

page:
  id: example-detail
  name: exampleDetail
  title: 示例详情
  type: detail
  permission: example:view

state:
  exampleId: null

dataSources:
  detail:
    type: service
    service: example.detail
    params:
      id: ${state.exampleId}

actions:
  goEdit:
    - action: navigate
      params:
        to: /examples/${state.exampleId}/edit

  goBack:
    - action: navigate
      params:
        to: /examples/list

lifecycle:
  onInit:
    - action: setState
      params:
        exampleId: ${route.params.id}
    - action: reload
      params:
        dataSource: detail

body:
  type: Page
  props:
    title: 示例详情
  children:
    - type: Flex
      props:
        justify: space-between
        align: center
      children:
        - type: Text
          props:
            text: ${data.detail.name}
            strong: true
        - type: Flex
          props:
            gap: middle
          children:
            - type: Button
              props:
                text: 返回
              events:
                onClick:
                  action: call
                  params:
                    name: goBack
            - type: Button
              props:
                text: 编辑
                variant: primary
              events:
                onClick:
                  action: call
                  params:
                    name: goEdit
              permission: example:edit

    - type: Card
      props:
        title: 基本信息
      children:
        - type: Grid
          props:
            columns: 2
            gap: 16
          children:
            - type: Statistic
              props:
                title: 名称
                value: ${data.detail.name}
            - type: Statistic
              props:
                title: 状态
                value: ${data.detail.status}
            - type: Statistic
              props:
                title: 创建时间
                value: ${data.detail.createdAt}
            - type: Statistic
              props:
                title: 备注
                value: ${data.detail.remark}

    - type: Alert
      props:
        message: 详情加载中…
        variant: info
      when: ${dataStatus.detail.loading}

    - type: Alert
      props:
        message: 加载失败，请返回重试
        variant: error
      when: ${dataStatus.detail.error != null}
