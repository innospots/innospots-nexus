dsl: '1.0'

page:
  id: example-form
  name: exampleForm
  title: 新建示例
  type: form
  permission: example:create

state:
  region: ''

dataSources:
  regionOptions:
    type: static
    value:
      - label: 华东
        value: east
      - label: 华南
        value: south

  cityOptions:
    type: static
    value: []

actions:
  submitForm:
    - id: saveResult
      action: request
      params:
        method: POST
        url: /api/examples
        body: ${form}
    - action: if
      params:
        condition: ${actions.saveResult != null && actions.saveResult.ok == false}
        then:
          - action: message
            params:
              type: error
              text: 保存失败
        else:
          - action: message
            params:
              type: success
              text: 保存成功
          - action: navigate
            params:
              to: /examples/list

  cancel:
    - action: navigate
      params:
        to: /examples/list

body:
  type: Page
  props:
    title: 新建示例
  children:
    - type: Card
      children:
        - type: Form
          props:
            name: main
            layout: vertical
            initialValues:
              name: ''
              region: ''
              city: ''
          children:
            - type: Input
              props:
                name: name
                label: 名称
                rules:
                  - required: true
                    message: 请输入名称

            - type: Select
              props:
                name: region
                label: 区域
                options: ${data.regionOptions}
                rules:
                  - required: true
                    message: 请选择区域
              events:
                onChange:
                  - action: form.setValues
                    params:
                      values:
                        city: ''
                  - action: setState
                    params:
                      region: ${event}

            - type: Select
              props:
                name: city
                label: 城市
                options: ${data.cityOptions}
                disabled: ${state.region == ''}

            - type: Flex
              props:
                gap: middle
                justify: end
              children:
                - type: Button
                  props:
                    text: 取消
                  events:
                    onClick:
                      action: call
                      params:
                        name: cancel
                - type: Button
                  props:
                    text: 保存
                    variant: primary
                    submit: true
          events:
            onSubmit:
              action: call
              params:
                name: submitForm
